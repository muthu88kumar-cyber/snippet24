<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Snippet24 — News, Explained</title>

<meta
  name="description"
  content="Snippet24 delivers concise news summaries with transparent source attribution."
>

<style>

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f3f6fa;
  color: #111827;
}

header {
  background:
    linear-gradient(
      135deg,
      #0f172a,
      #111827
    );

  color: white;

  padding: 42px 20px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
}

.logo {
  font-size: 36px;
  font-weight: 850;
  letter-spacing: -1px;
}

.tagline {
  margin-top: 6px;
  font-size: 17px;
  color: #cbd5e1;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 28px 16px 50px;
}

.status {
  background: white;

  border-radius: 16px;

  padding: 20px;

  margin-bottom: 26px;

  box-shadow:
    0 4px 20px rgba(15, 23, 42, .06);

  line-height: 1.6;
}

.status strong {
  display: block;
  margin-bottom: 4px;
  font-size: 17px;
}

.grid {
  display: grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(300px, 1fr)
    );

  gap: 20px;
}

.card {
  background: white;

  border-radius: 18px;

  padding: 22px;

  box-shadow:
    0 5px 22px rgba(15, 23, 42, .07);

  transition:
    transform .15s ease,
    box-shadow .15s ease;
}

.card:hover {
  transform: translateY(-2px);

  box-shadow:
    0 10px 30px rgba(15, 23, 42, .10);
}

.category {
  font-size: 12px;

  font-weight: 800;

  text-transform: uppercase;

  letter-spacing: .6px;

  color: #2563eb;
}

h2 {
  margin: 9px 0 13px;

  font-size: 22px;

  line-height: 1.3;

  color: #111827;
}

.summary {
  color: #4b5563;

  line-height: 1.65;

  font-size: 15px;
}

.badge {
  display: inline-block;

  margin-top: 15px;

  padding: 6px 9px;

  border-radius: 999px;

  background: #dcfce7;

  color: #166534;

  font-size: 11px;

  font-weight: 700;
}

.source {
  margin-top: 18px;

  padding-top: 15px;

  border-top:
    1px solid #e5e7eb;

  font-size: 13px;

  color: #6b7280;

  line-height: 1.5;
}

.source strong {
  color: #111827;
}

.source a {
  color: #2563eb;

  text-decoration: none;

  word-break: break-word;
}

.source a:hover {
  text-decoration: underline;
}

.read {
  display: inline-block;

  margin-top: 18px;

  padding: 11px 15px;

  background: #111827;

  color: white;

  text-decoration: none;

  border-radius: 9px;

  font-weight: 700;

  font-size: 14px;
}

.read:hover {
  background: #1f2937;
}

.empty {
  background: white;

  border-radius: 18px;

  padding: 50px 25px;

  text-align: center;

  grid-column: 1 / -1;

  box-shadow:
    0 5px 22px rgba(15, 23, 42, .06);
}

.empty h2 {
  font-size: 26px;
}

.empty p {
  color: #6b7280;

  font-size: 16px;

  line-height: 1.6;
}

.error {
  background: #fee2e2;

  color: #991b1b;

  padding: 18px;

  border-radius: 14px;
}

footer {
  text-align: center;

  padding: 40px 20px 55px;

  color: #6b7280;

  font-size: 13px;

  line-height: 1.7;
}

@media (max-width: 600px) {

  header {
    padding: 34px 20px;
  }

  .logo {
    font-size: 32px;
  }

  main {
    padding-top: 20px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

}

</style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      Snippet24
    </div>

    <div class="tagline">
      News, explained.
    </div>

  </div>

</header>


<main>

  <div class="status">

    <strong>
      AI-assisted original summaries.
    </strong>

    Sources are credited and linked
    to the original publication.

  </div>


  <div
    id="news"
    class="grid"
  >

    <div class="empty">

      <h2>
        Loading news...
      </h2>

      <p>
        Snippet24 is checking the latest
        approved sources.
      </p>

    </div>

  </div>

</main>


<footer>

  Snippet24 © 2026

  <br><br>

  News is presented with source attribution.
  Original publishers retain their rights.

</footer>


<script>

async function loadNews() {

  const container =
    document.getElementById("news");

  try {

    const response =
      await fetch(
        "articles.json?cache=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "articles.json returned HTTP " +
        response.status
      );
    }

    const articles =
      await response.json();

    if (!Array.isArray(articles)) {
      throw new Error(
        "articles.json is not an array"
      );
    }

    container.innerHTML = "";

    const published =
      articles.filter(
        article =>
          article &&
          article.snippet24_status ===
          "PUBLISHED"
      );

    if (published.length === 0) {

      container.innerHTML = `

        <div class="empty">

          <h2>
            No news stories yet
          </h2>

          <p>
            The news curator has not produced
            any automatically published stories yet.
          </p>

          <p>
            Please run the curator workflow again.
          </p>

        </div>

      `;

      return;
    }

    published.forEach(article => {

      const card =
        document.createElement(
          "article"
        );

      card.className = "card";

      const category =
        escapeHtml(
          article.category || "News"
        );

      const title =
        escapeHtml(
          article.title || "Untitled"
        );

      const summary =
        escapeHtml(
          article.summary || ""
        );

      const source =
        escapeHtml(
          article.source ||
          "Unknown source"
        );

      const sourceUrl =
        safeUrl(
          article.source_url
        );

      const id =
        encodeURIComponent(
          article.id || ""
        );

      const method =
        article.summary_method ===
        "ai"
          ? "AI-assisted original summary"
          : "Original automated summary";

      card.innerHTML = `

        <div class="category">
          ${category}
        </div>

        <h2>
          ${title}
        </h2>

        <div class="summary">
          ${summary}
        </div>

        <div class="badge">
          ${escapeHtml(method)}
        </div>

        <div class="source">

          Source:
          <strong>
            ${source}
          </strong>

          <br><br>

          Original publication:

          <br>

          <a
            href="${sourceUrl}"
            target="_blank"
            rel="noopener noreferrer"
          >
            Open original source
          </a>

        </div>

        <a
          class="read"
          href="article.html?id=${id}"
        >
          Read deep dive
        </a>

      `;

      container.appendChild(card);

    });

  } catch (error) {

    console.error(
      "Snippet24 news error:",
      error
    );

    container.innerHTML = `

      <div class="error">

        <strong>
          Unable to load the news feed.
        </strong>

        <br><br>

        Check that
        <strong>articles.json</strong>
        exists and contains valid JSON.

      </div>

    `;

  }

}


function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function safeUrl(value) {

  try {

    const url =
      new URL(value);

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {

      return url.href;

    }

  } catch (error) {

    console.warn(
      "Invalid source URL:",
      value
    );

  }

  return "#";

}


loadNews();

</script>

</body>

</html>
