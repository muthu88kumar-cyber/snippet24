<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snippet24 — Fast News. Real Impact.</title>
<meta name="description" content="Snippet24 — Fast News. Real Impact.">

<style>
:root{
  --navy:#071b3a;
  --navy2:#102a52;
  --yellow:#f7c600;
  --red:#df252b;
  --green:#176b4d;
  --light:#f6f8fb;
  --white:#ffffff;
  --text:#101d32;
  --muted:#68758a;
  --border:#e4e9f0;
  --shadow:0 8px 28px rgba(7,27,58,.08);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
}

/* ================= HEADER ================= */

.header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1200px;
  margin:auto;
  padding:18px 22px;
  display:flex;
  align-items:center;
  gap:28px;
}

/* LOGO */

.logo{
  min-width:230px;
  text-decoration:none;
  color:var(--navy);
}

.logo-main{
  display:flex;
  align-items:center;
  line-height:.85;
  font-size:52px;
  font-weight:900;
  letter-spacing:-4px;
}

.logo-snippet{
  position:relative;
}

.logo-snippet .red-dot{
  position:absolute;
  width:9px;
  height:9px;
  background:var(--red);
  border-radius:50%;
  top:-10px;
  left:49px;
}

.logo-24{
  margin-left:8px;
  background:var(--yellow);
  color:#fff;
  border-radius:16px;
  padding:9px 12px 7px;
  font-size:48px;
  letter-spacing:-4px;
  line-height:.82;
}

.slogan{
  margin-top:12px;
  margin-left:8px;
  font-size:12px;
  font-weight:800;
  letter-spacing:4px;
  color:var(--navy);
  white-space:nowrap;
}

.slogan span{
  color:var(--red);
}

/* SEARCH */

.search{
  flex:1;
  height:48px;
  border:1px solid var(--border);
  border-radius:28px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#fff;
}

.search-icon{
  font-size:18px;
  margin-right:10px;
}

.search input{
  border:0;
  outline:0;
  width:100%;
  font-size:15px;
}

/* WEATHER / TIME */

.header-info{
  display:flex;
  align-items:center;
  gap:22px;
  white-space:nowrap;
}

.weather{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
}

.weather-icon{
  font-size:25px;
}

.time{
  font-weight:800;
  font-size:14px;
}

/* ================= NAVIGATION ================= */

.nav{
  background:#fff;
  border-bottom:1px solid var(--border);
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  padding:8px 18px;
  display:flex;
  gap:6px;
  overflow-x:auto;
  scrollbar-width:none;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

.nav-item{
  flex:0 0 auto;
  border:0;
  background:transparent;
  color:var(--navy);
  padding:11px 15px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  transition:.2s;
}

.nav-item:hover,
.nav-item.active{
  background:var(--navy);
  color:#fff;
}

.nav-item.home{
  color:var(--red);
}

.nav-item.home:hover,
.nav-item.home.active{
  background:var(--red);
  color:#fff;
}

/* ================= LIVE BAR ================= */

.livebar{
  background:var(--navy);
  color:#fff;
}

.live-inner{
  max-width:1200px;
  margin:auto;
  padding:9px 22px;
  display:flex;
  align-items:center;
  gap:14px;
  overflow:hidden;
}

.live-label{
  flex:0 0 auto;
  color:var(--yellow);
  font-weight:900;
  font-size:12px;
  letter-spacing:1px;
}

.live-dot{
  width:8px;
  height:8px;
  background:var(--red);
  border-radius:50%;
  animation:pulse 1.3s infinite;
}

.live-text{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

@keyframes pulse{
  50%{opacity:.35}
}

/* ================= MAIN ================= */

.container{
  max-width:1200px;
  margin:auto;
  padding:28px 22px 70px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:25px 0 17px;
  font-size:15px;
  font-weight:900;
  text-transform:uppercase;
}

.section-title:before{
  content:"";
  width:5px;
  height:20px;
  border-radius:5px;
  background:var(--red);
}

/* ================= HERO ================= */

.hero{
  display:grid;
  grid-template-columns:1.45fr 1fr;
  gap:22px;
}

.hero-image{
  min-height:340px;
  border-radius:18px;
  background:
    linear-gradient(135deg,#e9eef5,#d9e1ec);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7d8a9e;
  overflow:hidden;
}

.hero-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.hero-content{
  padding:18px 0;
}

.category{
  display:inline-block;
  padding:6px 11px;
  background:#fff2f2;
  color:var(--red);
  border-radius:20px;
  font-size:11px;
  font-weight:900;
}

.hero h1{
  font-size:34px;
  line-height:1.08;
  margin:15px 0;
  letter-spacing:-1px;
}

.hero p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.meta{
  color:var(--muted);
  font-size:12px;
  margin-top:20px;
}

/* ================= STORY GRID ================= */

.story-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.story{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.story:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.story-img{
  height:135px;
  background:#e8edf4;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8290a4;
  overflow:hidden;
}

.story-img img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.story-body{
  padding:13px;
}

.story-category{
  color:var(--red);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}

.story h3{
  font-size:15px;
  line-height:1.25;
  margin:8px 0;
}

.story .meta{
  margin-top:8px;
}

/* ================= CATEGORY BLOCKS ================= */

.category-block{
  margin-top:38px;
}

.category-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid var(--navy);
  padding-bottom:9px;
  margin-bottom:15px;
}

.category-head h2{
  margin:0;
  font-size:20px;
}

.category-head button{
  border:0;
  background:none;
  color:var(--red);
  font-weight:800;
  cursor:pointer;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

/* ================= GOOD READ ================= */

.good-read{
  background:var(--navy);
  color:#fff;
  border-radius:18px;
  padding:28px;
  margin-top:40px;
}

.good-read .section-title{
  margin-top:0;
}

.good-read .section-title:before{
  background:var(--yellow);
}

.good-read .story{
  color:var(--text);
}

/* ================= EMPTY / LOADING ================= */

.loading{
  padding:50px;
  text-align:center;
  color:var(--muted);
}

.error{
  background:#fff1f1;
  color:#a71920;
  border:1px solid #ffd0d0;
  padding:15px;
  border-radius:10px;
}

/* ================= FOOTER ================= */

footer{
  background:var(--navy);
  color:#fff;
  margin-top:50px;
}

.footer-inner{
  max-width:1200px;
  margin:auto;
  padding:35px 22px;
  display:flex;
  justify-content:space-between;
  gap:25px;
}

.footer-logo{
  font-size:25px;
  font-weight:900;
}

.footer-logo span{
  color:var(--yellow);
}

.footer-text{
  color:#b9c4d4;
  font-size:13px;
  line-height:1.6;
}

/* ================= MOBILE ================= */

@media(max-width:900px){

  .header-inner{
    flex-wrap:wrap;
    gap:15px;
  }

  .logo{
    min-width:auto;
  }

  .logo-main{
    font-size:40px;
  }

  .logo-24{
    font-size:36px;
  }

  .slogan{
    font-size:9px;
    letter-spacing:2px;
  }

  .header-info{
    margin-left:auto;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero{
    grid-template-columns:1fr;
  }

  .story-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .category-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .container{
    padding:20px 14px 50px;
  }

  .header-inner{
    padding:14px;
  }

  .weather{
    display:none;
  }

  .time{
    display:none;
  }

  .hero h1{
    font-size:27px;
  }

  .hero-image{
    min-height:230px;
  }

  .story-grid,
  .category-grid{
    grid-template-columns:1fr;
  }

  .nav-item{
    padding:10px 12px;
  }

  .footer-inner{
    flex-direction:column;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="header-inner">

    <a class="logo" href="#" onclick="showHome();return false;">

      <div class="logo-main">

        <span class="logo-snippet">
          snippet
          <span class="red-dot"></span>
        </span>

        <span class="logo-24">24</span>

      </div>

      <div class="slogan">
        FAST NEWS <span>•</span> REAL IMPACT <span>•</span>
      </div>

    </a>

    <div class="search">
      <span class="search-icon">●</span>
      <input
        id="searchInput"
        type="search"
        placeholder="Search stories, topics, people..."
        oninput="searchStories(this.value)"
      >
    </div>

    <div class="header-info">

      <div class="weather">
        <span class="weather-icon">☀️</span>
        <div>
          <strong>28°C</strong><br>
          <small>Chennai, India</small>
        </div>
      </div>

      <div class="time" id="clock">
        8:52 am
      </div>

    </div>

  </div>

</header>

<!-- ================= SMART NAV ================= -->

<nav class="nav">

  <div class="nav-inner">

    <button class="nav-item home active" onclick="showHome()">⌂ Home</button>

    <button class="nav-item" onclick="filterCategory('In India')">
      🇮🇳 In India
    </button>

    <button class="nav-item" onclick="filterCategory('Security and Peace')">
      🛡 Security & Peace
    </button>

    <button class="nav-item" onclick="filterCategory('Law Around Us')">
      ⚖ Law Around Us
    </button>

    <button class="nav-item" onclick="filterCategory('Science and Development')">
      🔬 Science & Development
    </button>

    <button class="nav-item" onclick="filterCategory('Business and Economy')">
      ₹ Business & Economy
    </button>

    <button class="nav-item" onclick="filterCategory('Society and Culture')">
      👥 Society & Culture
    </button>

    <button class="nav-item" onclick="filterCategory('Human and Environment')">
      🌱 Human & Environment
    </button>

    <button class="nav-item" onclick="filterCategory('Tech and AI')">
      ◉ Tech & AI
    </button>

    <button class="nav-item" onclick="filterCategory('Good Reads')">
      ✦ Good Reads
    </button>

  </div>

</nav>

<!-- ================= LIVE ================= -->

<div class="livebar">

  <div class="live-inner">

    <span class="live-dot"></span>

    <span class="live-label">LIVE WIRE</span>

    <span class="live-text" id="liveText">
      Latest news and important developments from India and around the world
    </span>

  </div>

</div>

<!-- ================= MAIN ================= -->

<main class="container">

  <div id="app">

    <div class="loading">
      Loading latest stories...
    </div>

  </div>

</main>

<!-- ================= FOOTER ================= -->

<footer>

  <div class="footer-inner">

    <div>

      <div class="footer-logo">
        snippet <span>24</span>
      </div>

      <div class="footer-text">
        FAST NEWS • REAL IMPACT
      </div>

    </div>

    <div class="footer-text">
      © 2026 Snippet24. News, ideas and stories that matter.
    </div>

  </div>

</footer>

<script>

/* =========================================================
   SNIPPET24 NEWS ENGINE
========================================================= */

let articles = [];
let filteredArticles = [];

const categories = [
  "In India",
  "Security and Peace",
  "Law Around Us",
  "Science and Development",
  "Business and Economy",
  "Society and Culture",
  "Human and Environment",
  "Tech and AI",
  "Good Reads"
];

/* =========================================================
   LOAD ARTICLES.JSON
========================================================= */

async function loadArticles(){

  try{

    const response = await fetch("articles.json");

    if(!response.ok){
      throw new Error("Unable to load articles.json");
    }

    const data = await response.json();

    if(Array.isArray(data)){
      articles = data;
    }
    else if(Array.isArray(data.articles)){
      articles = data.articles;
    }
    else if(Array.isArray(data.items)){
      articles = data.items;
    }
    else{
      articles = [];
    }

    filteredArticles = articles;

    renderHome();

  }
  catch(error){

    console.error(error);

    document.getElementById("app").innerHTML = `
      <div class="error">
        <strong>News could not be loaded.</strong><br><br>
        Please check that <b>articles.json</b> is present in the same GitHub folder as index.html.
      </div>
    `;

  }

}

/* =========================================================
   GET ARTICLE VALUES
========================================================= */

function getTitle(article){

  return article.title ||
         article.headline ||
         article.name ||
         "Untitled story";

}

function getDescription(article){

  return article.description ||
         article.summary ||
         article.excerpt ||
         article.content ||
         "";

}

function getImage(article){

  return article.image ||
         article.image_url ||
         article.imageUrl ||
         article.thumbnail ||
         article.urlToImage ||
         "";

}

function getCategory(article){

  return article.category ||
         article.section ||
         article.topic ||
         "In India";

}

function getSource(article){

  return article.source ||
         article.source_name ||
         article.publisher ||
         "Snippet24";

}

function getTime(article){

  return article.time ||
         article.publishedAt ||
         article.date ||
         "";

}

/* =========================================================
   IMAGE
========================================================= */

function imageHTML(article,className){

  const image = getImage(article);

  if(!image){
    return `
      <div class="${className}">
        Image unavailable
      </div>
    `;
  }

  return `
    <div class="${className}">
      <img
        src="${escapeHTML(image)}"
        alt=""
        loading="lazy"
        onerror="this.parentElement.innerHTML='Image unavailable'"
      >
    </div>
  `;

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

/* =========================================================
   STORY CARD
========================================================= */

function storyCard(article){

  return `
    <article class="story">

      ${imageHTML(article,"story-img")}

      <div class="story-body">

        <div class="story-category">
          ${escapeHTML(getCategory(article))}
        </div>

        <h3>
          ${escapeHTML(getTitle(article))}
        </h3>

        <div class="meta">
          ${escapeHTML(getTime(article))}
          ${getTime(article) ? " • " : ""}
          ${escapeHTML(getSource(article))}
        </div>

      </div>

    </article>
  `;

}

/* =========================================================
   HOME
========================================================= */

function showHome(){

  document.querySelectorAll(".nav-item")
    .forEach(x => x.classList.remove("active"));

  document.querySelector(".nav-item.home")
    .classList.add("active");

  document.getElementById("searchInput").value="";

  filteredArticles = articles;

  renderHome();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

/* =========================================================
   HOME RENDER
========================================================= */

function renderHome(){

  if(!articles.length){

    document.getElementById("app").innerHTML = `
      <div class="loading">
        No stories available.
      </div>
    `;

    return;

  }

  const hero = articles[0];

  const secondary = articles.slice(1,5);

  let html = `

    <div class="section-title">
      Latest Stories
    </div>

    <section class="hero">

      ${imageHTML(hero,"hero-image")}

      <div class="hero-content">

        <span class="category">
          ${escapeHTML(getCategory(hero))}
        </span>

        <h1>
          ${escapeHTML(getTitle(hero))}
        </h1>

        <p>
          ${escapeHTML(getDescription(hero)).substring(0,280)}
        </p>

        <div class="meta">
          ${escapeHTML(getTime(hero))}
          ${getTime(hero) ? " • " : ""}
          ${escapeHTML(getSource(hero))}
        </div>

      </div>

    </section>

    <div style="height:18px"></div>

    <section class="story-grid">

      ${secondary.map(storyCard).join("")}

    </section>

  `;

  categories.forEach(category => {

    const items = articles
      .filter(a => normalise(getCategory(a)) === normalise(category))
      .slice(0,6);

    if(!items.length) return;

    html += `

      <section class="category-block">

        <div class="category-head">

          <h2>
            ${escapeHTML(category)}
          </h2>

          <button onclick="filterCategory('${escapeHTML(category)}')">
            View all →
          </button>

        </div>

        <div class="category-grid">

          ${items.map(storyCard).join("")}

        </div>

      </section>

    `;

  });

  document.getElementById("app").innerHTML = html;

}

/* =========================================================
   CATEGORY FILTER
========================================================= */

function normalise(value){

  return String(value || "")
    .toLowerCase()
    .replace(/&/g,"and")
    .replace(/[^a-z0-9]/g,"");

}

function filterCategory(category){

  document.querySelectorAll(".nav-item")
    .forEach(x => x.classList.remove("active"));

  filteredArticles = articles.filter(article =>
    normalise(getCategory(article)) === normalise(category)
  );

  if(!filteredArticles.length){

    document.getElementById("app").innerHTML = `

      <div class="section-title">
        ${escapeHTML(category)}
      </div>

      <div class="loading">
        No stories available in this category yet.
      </div>

    `;

    return;

  }

  document.getElementById("app").innerHTML = `

    <div class="section-title">
      ${escapeHTML(category)}
    </div>

    <div class="category-grid">

      ${filteredArticles.map(storyCard).join("")}

    </div>

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

/* =========================================================
   SEARCH
========================================================= */

function searchStories(query){

  query = query.trim().toLowerCase();

  if(!query){

    renderHome();
    return;

  }

  const results = articles.filter(article => {

    const text = [

      getTitle(article),
      getDescription(article),
      getCategory(article),
      getSource(article)

    ].join(" ").toLowerCase();

    return text.includes(query);

  });

  document.getElementById("app").innerHTML = `

    <div class="section-title">
      Search results
    </div>

    ${
      results.length
      ?
      `<div class="category-grid">
        ${results.map(storyCard).join("")}
      </div>`
      :
      `<div class="loading">
        No stories found for "<strong>${escapeHTML(query)}</strong>"
      </div>`
    }

  `;

}

/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const now = new Date();

  document.getElementById("clock").textContent =
    now.toLocaleTimeString("en-IN",{
      hour:"numeric",
      minute:"2-digit"
    });

}

updateClock();

setInterval(updateClock,30000);

/* =========================================================
   LIVE WIRE
========================================================= */

function updateLiveWire(){

  if(!articles.length) return;

  const index =
    Math.floor(Date.now()/5000) % articles.length;

  document.getElementById("liveText").textContent =
    getTitle(articles[index]);

}

setInterval(updateLiveWire,5000);

/* =========================================================
   START
========================================================= */

loadArticles();

</script>

</body>
</html>
