<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snippet24 — Fast News. Real Impact.</title>
<style>
* {
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    margin: 0;
    background: #080b11;
    color: #f5f5f5;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
}
a {
    color: inherit;
    text-decoration: none;
}
.header {
    padding: 32px 28px 22px;
    background: #080b11;
}
.logo {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: -3px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
}
.logo24 {
    background: #ed0714;
    color: white;
    border-radius: 13px;
    padding: 2px 11px 5px;
    font-size: 34px;
    letter-spacing: -2px;
}
.tagline {
    margin-top: 7px;
    color: #8d929d;
    font-size: 16px;
    letter-spacing: 5px;
    font-weight: 500;
}
.nav-wrapper {
    overflow-x: auto;
    border-bottom: 1px solid #252b36;
    background: #080b11;
    scrollbar-width: none;
}
.nav-wrapper::-webkit-scrollbar {
    display: none;
}
.nav {
    display: flex;
    gap: 12px;
    padding: 18px 28px;
    min-width: max-content;
}
.nav button {
    border: 0;
    background: transparent;
    color: #aeb3bd;
    font-size: 18px;
    font-weight: 700;
    padding: 12px 20px;
    border-radius: 14px;
    cursor: pointer;
}
.nav button.active {
    background: #ed0714;
    color: white;
}
.container {
    max-width: 1150px;
    margin: 0 auto;
    padding: 28px;
}
.feed-header {
    background: #121721;
    border: 1px solid #29313d;
    border-radius: 22px;
    padding: 25px;
    margin-bottom: 22px;
}
.feed-label {
    color: #a2a8b3;
    font-size: 17px;
    margin-bottom: 3px;
}
.feed-title {
    font-size: 31px;
    font-weight: 800;
    margin-bottom: 20px;
}
.language {
    width: 100%;
    border: 0;
    border-radius: 12px;
    background: #ed0714;
    color: white;
    padding: 15px;
    font-size: 17px;
    font-weight: 600;
}
.intro {
    background: #10151e;
    border: 1px solid #29313d;
    border-radius: 22px;
    padding: 28px;
    margin-bottom: 25px;
}
.intro h2 {
    margin: 0 0 12px;
    font-size: 28px;
}
.intro p {
    margin: 0;
    color: #9da3ae;
    font-size: 18px;
    line-height: 1.6;
}
.status {
    margin-bottom: 20px;
    color: #8e96a3;
    font-size: 14px;
}
.error {
    background: #151923;
    border: 1px solid #4a2025;
    border-radius: 22px;
    padding: 50px 25px;
    text-align: center;
}
.error h2 {
    font-size: 31px;
    margin: 0 0 15px;
}
.error p {
    color: #9da3ae;
    line-height: 1.6;
}
.retry {
    border: 0;
    background: #ed0714;
    color: white;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 10px;
}
.news-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
}
.article {
    background: #111620;
    border: 1px solid #29313d;
    border-radius: 20px;
    padding: 22px;
    transition: transform .15s ease, border-color .15s ease;
}
.article:hover {
    transform: translateY(-2px);
    border-color: #555e6d;
}
.article-source {
    color: #ed3340;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .7px;
    margin-bottom: 10px;
}
.article h3 {
    font-size: 21px;
    line-height: 1.35;
    margin: 0 0 12px;
}
.article-description {
    color: #9ca3af;
    line-height: 1.55;
    font-size: 15px;
    margin-bottom: 16px;
}
.article-meta {
    color: #707987;
    font-size: 12px;
    display: flex;
    justify-content: space-between;
    gap: 10px;
}
.read-more {
    display: inline-block;
    margin-top: 16px;
    color: #ff3a46;
    font-size: 14px;
    font-weight: 700;
}
.empty {
    background: #111620;
    border: 1px solid #29313d;
    border-radius: 22px;
    padding: 55px 25px;
    text-align: center;
}
.loading {
    background: #111620;
    border: 1px solid #29313d;
    border-radius: 22px;
    padding: 55px 25px;
    text-align: center;
    color: #9da3ae;
}
@media (max-width: 700px) {
    .header {
        padding: 25px 20px 17px;
    }
    .logo {
        font-size: 36px;
    }
    .logo24 {
        font-size: 29px;
    }
    .tagline {
        font-size: 12px;
        letter-spacing: 3.5px;
    }
    .nav {
        padding: 14px 20px;
    }
    .nav button {
        font-size: 17px;
        padding: 11px 16px;
    }
    .container {
        padding: 20px;
    }
    .news-grid {
        grid-template-columns: 1fr;
    }
    .feed-title {
        font-size: 28px;
    }
}
</style>
</head>
<body>
<header class="header">
    <div class="logo">
        snippet
        <span class="logo24">24</span>
    </div>
    <div class="tagline">
        FAST NEWS. REAL IMPACT.
    </div>
</header>
<div class="nav-wrapper">
    <nav class="nav" id="nav"></nav>
</div>
<main class="container">
    <section class="feed-header">
        <div class="feed-label">Current feed:</div>
        <div class="feed-title" id="feedTitle">Top Stories</div>
        <div class="language">
            English
        </div>
    </section>
    <section class="intro">
        <h2>Know more. Read less.</h2>
        <p>
            Short, original explanations of important stories,
            with the original publication always credited.
        </p>
    </section>
    <div id="status" class="status">
        Loading news…
    </div>
    <section id="content">
        <div class="loading">
            Loading the latest news…
        </div>
    </section>
</main>
<script>
const CATEGORIES = [
    "Top Stories",
    "World",
    "India",
    "States",
    "Tech & AI",
    "Business",
    "Lifestyle"
];
const MAX_ARTICLES = 50;
let newsData = {
    categories: {}
};
let currentCategory = "Top Stories";
/* -------------------------------------------------------
   NAVIGATION
------------------------------------------------------- */
function createNavigation() {
    const nav = document.getElementById("nav");
    nav.innerHTML = "";
    CATEGORIES.forEach(category => {
        const button = document.createElement("button");
        button.textContent = category;
        if (category === currentCategory) {
            button.classList.add("active");
        }
        button.addEventListener("click", () => {
            currentCategory = category;
            document
                .querySelectorAll(".nav button")
                .forEach(btn => btn.classList.remove("active"));
            button.classList.add("active");
            document.getElementById("feedTitle").textContent =
                category;
            renderArticles();
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        });
        nav.appendChild(button);
    });
}
/* -------------------------------------------------------
   DATE
------------------------------------------------------- */
function getArticleDate(article) {
    return (
        article.published_at ||
        article.fetched_at ||
        article.updated_at ||
        ""
    );
}
/* -------------------------------------------------------
   NORMALIZE ARTICLE
------------------------------------------------------- */
function normalizeArticle(article, category) {
    if (!article || typeof article !== "object") {
        return null;
    }
    const title =
        String(article.title || "").trim();
    const url =
        String(article.url || article.link || "").trim();
    if (!title || !url) {
        return null;
    }
    return {
        id:
            article.id ||
            url ||
            title,
        title,
        description:
            String(
                article.description ||
                article.summary ||
                ""
            ).trim(),
        url,
        source:
            String(
                article.source ||
                article.publisher ||
                "News source"
            ).trim(),
        category:
            article.category ||
            category,
        published_at:
            article.published_at ||
            article.publishedAt ||
            "",
        fetched_at:
            article.fetched_at ||
            ""
    };
}
/* -------------------------------------------------------
   DEDUPLICATION
------------------------------------------------------- */
function deduplicateArticles(articles) {
    const seen = new Set();
    const result = [];
    for (const article of articles) {
        if (!article) {
            continue;
        }
        const key =
            article.id ||
            article.url ||
            article.title.toLowerCase();
        if (seen.has(key)) {
            continue;
        }
        seen.add(key);
        result.push(article);
    }
    return result;
}
/* -------------------------------------------------------
   SORT NEWEST FIRST
------------------------------------------------------- */
function sortNewest(articles) {
    return [...articles].sort((a, b) => {
        const dateA =
            Date.parse(getArticleDate(a)) || 0;
        const dateB =
            Date.parse(getArticleDate(b)) || 0;
        return dateB - dateA;
    });
}
/* -------------------------------------------------------
   TOP STORIES
------------------------------------------------------- */
function getTopStories() {
    const all = [];
    const categories =
        newsData.categories || {};
    Object.keys(categories).forEach(category => {
        const articles =
            Array.isArray(categories[category])
                ? categories[category]
                : [];
        articles.forEach(article => {
            const normalized =
                normalizeArticle(article, category);
            if (normalized) {
                all.push(normalized);
            }
        });
    });
    return sortNewest(
        deduplicateArticles(all)
    ).slice(0, MAX_ARTICLES);
}
/* -------------------------------------------------------
   CATEGORY ARTICLES
------------------------------------------------------- */
function getCategoryArticles(category) {
    if (category === "Top Stories") {
        return getTopStories();
    }
    const articles =
        Array.isArray(newsData.categories?.[category])
            ? newsData.categories[category]
            : [];
    return sortNewest(
        deduplicateArticles(
            articles.map(article =>
                normalizeArticle(article, category)
            )
        )
    ).slice(0, MAX_ARTICLES);
}
/* -------------------------------------------------------
   DATE DISPLAY
------------------------------------------------------- */
function formatDate(value) {
    if (!value) {
        return "";
    }
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return "";
    }
    return date.toLocaleString("en-IN", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
    });
}
/* -------------------------------------------------------
   HTML ESCAPE
------------------------------------------------------- */
function escapeHtml(value) {
    return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}
/* -------------------------------------------------------
   RENDER
------------------------------------------------------- */
function renderArticles() {
    const content =
        document.getElementById("content");
    const articles =
        getCategoryArticles(currentCategory);
    document.getElementById("feedTitle").textContent =
        currentCategory;
    document.getElementById("status").textContent =
        `${articles.length} stories available`;
    if (!articles.length) {
        content.innerHTML = `
            <div class="empty">
                <h2>No stories available</h2>
                <p>
                    There are currently no articles in
                    ${escapeHtml(currentCategory)}.
                </p>
            </div>
        `;
        return;
    }
    content.innerHTML = `
        <div class="news-grid">
            ${articles.map(article => {
                const title =
                    escapeHtml(article.title);
                const description =
                    escapeHtml(article.description);
                const source =
                    escapeHtml(article.source);
                const date =
                    escapeHtml(
                        formatDate(
                            getArticleDate(article)
                        )
                    );
                const url =
                    escapeHtml(article.url);
                return `
                    <article class="article">
                        <div class="article-source">
                            ${source}
                        </div>
                        <h3>
                            ${title}
                        </h3>
                        ${
                            description
                                ? `
                                    <div class="article-description">
                                        ${description}
                                    </div>
                                  `
                                : ""
                        }
                        <div class="article-meta">
                            <span>
                                ${date}
                            </span>
                            <span>
                                ${escapeHtml(article.category)}
                            </span>
                        </div>
                        <a
                            class="read-more"
                            href="${url}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            Read original →
                        </a>
                    </article>
                `;
            }).join("")}
        </div>
    `;
}
/* -------------------------------------------------------
   LOAD JSON
------------------------------------------------------- */
async function loadNews() {
    const content =
        document.getElementById("content");
    const status =
        document.getElementById("status");
    content.innerHTML = `
        <div class="loading">
            Loading the latest news…
        </div>
    `;
    status.textContent =
        "Connecting to news database…";
    try {
        /*
         * IMPORTANT:
         * articles.json must be in the SAME folder
         * as index.html.
         */
        const jsonUrl =
            new URL(
                "articles.json",
                document.baseURI
            ).href
            + "?v="
            + Date.now();
        console.log(
            "Loading articles from:",
            jsonUrl
        );
        const response =
            await fetch(
                jsonUrl,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );
        console.log(
            "articles.json HTTP status:",
            response.status
        );
        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status} while loading articles.json`
            );
        }
        const data =
            await response.json();
        console.log(
            "articles.json loaded:",
            data
        );
        if (
            !data ||
            typeof data !== "object"
        ) {
            throw new Error(
                "articles.json is not a valid JSON object"
            );
        }
        if (
            !data.categories ||
            typeof data.categories !== "object"
        ) {
            throw new Error(
                "articles.json does not contain a categories object"
            );
        }
        newsData = data;
        let total = 0;
        Object.keys(
            newsData.categories
        ).forEach(category => {
            if (
                Array.isArray(
                    newsData.categories[category]
                )
            ) {
                total +=
                    newsData.categories[category].length;
            }
        });
        console.log(
            "Total articles:",
            total
        );
        if (total === 0) {
            throw new Error(
                "articles.json contains 0 articles"
            );
        }
        status.textContent =
            `${total} articles loaded successfully`;
        createNavigation();
        renderArticles();
    } catch (error) {
        console.error(
            "NEWS LOAD ERROR:",
            error
        );
        status.textContent =
            "Unable to load news";
        content.innerHTML = `
            <div class="error">
                <h2>
                    News feed unavailable
                </h2>
                <p>
                    The website could not load
                    <strong>articles.json</strong>.
                </p>
                <p style="font-size:13px;">
                    Error:
                    ${escapeHtml(error.message)}
                </p>
                <button
                    class="retry"
                    onclick="loadNews()"
                >
                    Try again
                </button>
            </div>
        `;
    }
}
/* -------------------------------------------------------
   START
------------------------------------------------------- */
createNavigation();
loadNews();
</script>
</body>
</html>
