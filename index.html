<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Snippet24 — News, Explained</title>

<meta
  name="description"
  content="Snippet24 delivers concise, independently written news summaries with transparent source attribution."
>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f5f7fa;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.header-inner {
  max-width: 1100px;
  margin: auto;

  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 26px;
  font-weight: 800;
}

.tagline {
  opacity: .75;
  font-size: 13px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 24px 16px;
}

.status {
  padding: 12px 16px;
  background: white;
  border-radius: 10px;
  margin-bottom: 20px;
  font-size: 14px;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(320px, 1fr));

  gap: 18px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;

  box-shadow:
    0 2px 10px rgba(0,0,0,.05);
}

.category {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  color: #2563eb;
}

h2 {
  margin: 8px 0 12px;
  font-size: 22px;
  line-height: 1.25;
}

.summary {
  color: #4b5563;
  line-height: 1.6;
}

.source {
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid #e5e7eb;

  font-size: 13px;
}

.source a {
  color: #2563eb;
  word-break: break-all;
}

.read {
  display: inline-block;
  margin-top: 16px;

  padding: 10px 14px;

  background: #111827;
  color: white;

  text-decoration: none;
  border-radius: 8px;
}

.badge {
  display: inline-block;
  margin-top: 10px;

  font-size: 11px;
  padding: 5px 8px;

  border-radius: 999px;
  background: #dcfce7;
  color: #166534;
}

.review {
  background: #fef3c7;
  color: #92400e;
}

footer {
  text-align: center;
  padding: 40px 20px;

  color: #6b7280;
  font-size: 13px;
}

</style>

</head>

<body>

<header>

<div class="header-inner">

<div>
  <div class="logo">Snippet24</div>

  <div class="tagline">
    News, explained.
  </div>
</div>

</div>

</header>


<main>

<div class="status">
  AI-assisted original summaries.
  Sources are credited and linked to the original publication.
</div>

<div
  id="news"
  class="grid"
>
  Loading news...
</div>

</main>


<footer>

Snippet24 © 2026

<br><br>

News is presented with source attribution.
Original publishers retain their rights.

</footer>


<script>

async function loadNews() {

  const container =
    document.getElementById("news");

  try {

    const response =
      await fetch("articles.json?x=" + Date.now());

    const articles =
      await response.json();

    container.innerHTML = "";

    const published =
      articles.filter(
        article =>
          article.snippet24_status === "PUBLISHED"
      );

    if (published.length === 0) {

      container.innerHTML =
        "<p>No automatically published stories yet.</p>";

      return;
    }

    published.forEach(article => {

      const card =
        document.createElement("article");

      card.className = "card";

      card.innerHTML = `

        <div class="category">
          ${escapeHtml(article.category || "News")}
        </div>

        <h2>
          ${escapeHtml(article.title)}
        </h2>

        <div class="summary">
          ${escapeHtml(article.summary || "")}
        </div>

        <div class="badge">
          AI-assisted original summary
        </div>

        <div class="source">

          Source:
          <strong>
            ${escapeHtml(article.source)}
          </strong>

          <br><br>

          Original URL:

          <br>

          <a
            href="${safeUrl(article.source_url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            ${escapeHtml(article.source_url)}
          </a>

        </div>

        <a
          class="read"
          href="article.html?id=${encodeURIComponent(article.id)}"
        >
          Read deep dive
        </a>

      `;

      container.appendChild(card);

    });

  } catch (error) {

    container.innerHTML =
      "<p>Unable to load the news feed.</p>";

    console.error(error);

  }

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function safeUrl(value) {

  try {

    const url =
      new URL(value);

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {
      return url.href;
    }

  } catch {}

  return "#";

}


loadNews();

</script>

</body>

</html>
