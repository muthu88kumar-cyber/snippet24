<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snippet24 - Professional News Briefs</title>
    <style>
        :root { --primary: #e63946; --bg: #f8f9fa; --card-bg: #ffffff; --text: #212529; --muted: #6c757d; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        header { background: #fff; padding: 15px 20px; border-bottom: 1px solid #dee2e6; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); text-decoration: none; }
        select { padding: 6px 12px; border-radius: 6px; border: 1px solid #ced4da; background: #fff; font-size: 0.9rem; }
        .categories { display: flex; overflow-x: auto; background: #fff; padding: 10px 15px; gap: 10px; border-bottom: 1px solid #dee2e6; white-space: nowrap; }
        .cat-btn { background: #f1f3f5; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: var(--muted); transition: 0.2s; }
        .cat-btn.active { background: var(--primary); color: #fff; }
        .container { max-width: 680px; margin: 20px auto; padding: 0 15px; }
        .card { background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; overflow: hidden; border: 1px solid #edf2f7; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card-content { padding: 20px; }
        .badge { background: #ffe3e3; color: var(--primary); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
        h2 { font-size: 1.25rem; margin: 0 0 10px 0; line-height: 1.4; }
        p.summary { font-size: 0.95rem; color: #495057; line-height: 1.6; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
        .deep-btn { width: 100%; background: #f8f9fa; border: 1px solid #ced4da; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--text); }
        .deep-btn:hover { background: #e9ecef; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: #fff; width: 100%; max-width: 680px; max-height: 85vh; border-top-left-radius: 20px; border-top-right-radius: 20px; padding: 25px; overflow-y: auto; box-sizing: border-box; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .close-btn { float: right; background: #f1f3f5; border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .modal-body p { line-height: 1.7; color: #333; margin-bottom: 15px; }
        footer { text-align: center; padding: 30px; color: var(--muted); font-size: 0.85rem; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">snippet24.in</a>
        <select id="langSelect" onchange="changeLanguage()">
            <option value="en">English</option>
            <option value="hi">हिंदी</option>
            <option value="ta">தமிழ்</option>
            <option value="te">తెలుగు</option>
            <option value="kn">ಕನ್ನಡ</option>
            <option value="ml">മലയാളം</option>
        </select>
    </header>

    <div class="categories" id="categoryNav">
        <button class="cat-btn active" onclick="filterCategory('All', this)">All News</button>
    </div>

    <main class="container" id="newsFeed">
        <!-- Articles loaded dynamically -->
    </main>

    <!-- Deep Dive Modal -->
    <div class="modal" id="deepDiveModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="toggleModal(false)">&times;</button>
            <h3 id="modalTitle" style="margin-top:0; font-size: 1.3rem;"></h3>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <footer>
        &copy; 2026 snippet24.in • All source protections apply.
    </footer>

    <script>
        let articlesData = [];
        let currentLang = 'en';
        let currentCategory = 'All';

        async function loadArticles() {
            try {
                const response = await fetch('articles.json');
                const data = await response.json();
                articlesData = data.live_feed;
                buildCategories();
                renderFeed();
            } catch (error) {
                console.error('Error loading articles:', error);
            }
        }

        function buildCategories() {
            const nav = document.getElementById('categoryNav');
            const categories = ['All', ...new Set(articlesData.map(item => item.category))];
            nav.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === 'All' ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>
            `).join('');
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderFeed();
        }

        function changeLanguage() {
            currentLang = document.getElementById('langSelect').value;
            renderFeed();
        }

        function renderFeed() {
            const feed = document.getElementById('newsFeed');
            const filtered = currentCategory === 'All' ? articlesData : articlesData.filter(i => i.category === currentCategory);

            feed.innerHTML = filtered.map((item, index) => {
                const title = item.title[currentLang] || item.title['en'];
                const summary = item.summary[currentLang] || item.summary['en'];
                return `
                    <article class="card">
                        <img src="${item.image}" alt="News Image" loading="lazy">
                        <div class="card-content">
                            <span class="badge">${item.category}</span>
                            <h2>${title}</h2>
                            <p class="summary">${summary}</p>
                            <button class="deep-btn" onclick="openDeepDive(${index})">
                                🚀 Deep Dive (Summary & Subtitles)
                            </button>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function openDeepDive(index) {
            const filtered = currentCategory === 'All' ? articlesData : articlesData.filter(i => i.category === currentCategory);
            const item = filtered[index];
            const title = item.title[currentLang] || item.title['en'];
            const deepDiveText = item.deep_dive[currentLang] || item.deep_dive['en'];

            document.getElementById('modalTitle').innerText = title;
            // Split 3 paragraphs cleanly by double line breaks
            const paragraphs = deepDiveText.split('\n\n').map(p => `<p>${p}</p>`).join('');
            document.getElementById('modalBody').innerHTML = paragraphs;
            toggleModal(true);
        }

        function toggleModal(show) {
            document.getElementById('deepDiveModal').classList.toggle('active', show);
        }

        function closeModal(e) {
            if (e.target.id === 'deepDiveModal') toggleModal(false);
        }

        loadArticles();
    </script>
</body>
</html>
