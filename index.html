<!-- Compact Trigger Button for Citizen Wire (Place this inside your sidebar or header area) -->
<div style="margin: 20px 0;">
    <button onclick="document.getElementById('citizenModal').style.display='flex'" style="width: 100%; background: #FF3B30; color: #fff; border: none; padding: 12px; font-size: 13px; font-weight: 700; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; text-transform: uppercase;">
        <i class="fa-solid fa-bullhorn"></i> Submit Local News / Citizen Wire
    </button>
</div>

<!-- Modal Overlay (Hidden by Default) -->
<div id="citizenModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; padding: 20px;">
    
    <!-- Modal Box Container -->
    <div style="background: #fff; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; border-radius: 10px; padding: 25px; position: relative; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        
        <!-- Close Button -->
        <button onclick="document.getElementById('citizenModal').style.display='none'" style="position: absolute; top: 15px; right: 15px; background: #f1f5f9; border: none; font-size: 16px; font-weight: 700; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: #334155;">&times;</button>

        <!-- Header -->
        <div style="border-bottom: 2px solid #0f172a; padding-bottom: 10px; margin-bottom: 20px;">
            <h3 style="font-size: 16px; color: #0f172a; font-weight: 700; text-transform: uppercase;">🌍 Citizen Wire: Local Public Dispatch</h3>
            <p style="font-size: 11px; color: #64748b;">Publish hyper-local updates securely. Subject to strict Indian & international legal compliance.</p>
        </div>

        <!-- Form Fields -->
        <form id="citizenNewsForm" style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label style="display: block; font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px;">Full Legal Name *</label>
                <input type="text" id="citizenName" required placeholder="As per official ID" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px;">
            </div>
            <div>
                <label style="display: block; font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px;">Verified Phone (OTP) *</label>
                <input type="tel" id="citizenPhone" required placeholder="+91 XXXXX XXXXX" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px;">
            </div>

            <div style="grid-column: span 2;">
                <label style="display: block; font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px;">Headline / Title *</label>
                <input type="text" id="citizenTitle" required placeholder="Non-sensationalized local event headline" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px;">
            </div>

            <div>
                <label style="display: block; font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px;">Location / District *</label>
                <input type="text" id="citizenLocation" required placeholder="e.g., Tiruvaloor, Chennai" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px;">
            </div>
            <div>
                <label style="display: block; font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px;">Category *</label>
                <select id="citizenCategory" style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px; background: #fff;">
                    <option value="Local Governance">Local Governance & Civic</option>
                    <option value="Public Safety">Public Safety & Traffic</option>
                    <option value="Community">Community & Culture</option>
                    <option value="Environment">Environment & Infrastructure</option>
                </select>
            </div>

            <div style="grid-column: span 2;">
                <label style="display: block; font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px;">News Report Body *</label>
                <textarea id="citizenBody" rows="3" required placeholder="Provide objective facts, dates, and context..." style="width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; font-size: 12px;"></textarea>
            </div>

            <div style="grid-column: span 2;">
                <label style="display: block; font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px;">Media Evidence (Raw Capture) *</label>
                <input type="file" id="citizenMedia" accept="image/*,video/*" required style="font-size: 11px;">
            </div>

            <!-- Mandatory Legal Declarations -->
            <div style="grid-column: span 2; background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px; border-radius: 5px;">
                <p style="font-size: 11px; font-weight: 700; color: #0f172a; margin-bottom: 6px;">Legal Compliance & Intermediary Safety Rules:</p>
                
                <label style="display: flex; gap: 6px; font-size: 11px; color: #334155; margin-bottom: 4px; cursor: pointer;">
                    <input type="checkbox" id="legalTruth" required style="margin-top: 2px;">
                    I declare information is truthful and non-defamatory under the Bharatiya Nyaya Sanhita (BNS).
                </label>
                <label style="display: flex; gap: 6px; font-size: 11px; color: #334155; margin-bottom: 4px; cursor: pointer;">
                    <input type="checkbox" id="legalAI" required style="margin-top: 2px;">
                    I confirm this media is <strong>not</strong> an AI-generated deepfake or synthetic fabrication.
                </label>
                <label style="display: flex; gap: 6px; font-size: 11px; color: #334155; cursor: pointer;">
                    <input type="checkbox" id="legalLiability" required style="margin-top: 2px;">
                    I understand audit logs (IP/Phone) are retained for compliance with Indian IT Rules.
                </label>
            </div>

            <div style="grid-column: span 2; text-align: right; margin-top: 5px;">
                <button type="submit" style="background: #0f172a; color: #fff; border: none; padding: 10px 20px; font-size: 12px; font-weight: 700; border-radius: 5px; cursor: pointer;">
                    Submit for Staging Review →
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('citizenNewsForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Dispatch received successfully! Queued for editorial and automated metadata verification.');
    document.getElementById('citizenModal').style.display = 'none';
    this.reset();
});
</script>
