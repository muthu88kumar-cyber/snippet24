<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>snippet24 — Fast News. Real Impact.</title>

<meta
  name="description"
  content="snippet24 — concise news from India and the world."
>

<style>

:root {

  --black: #080A0F;
  --header: #0D1320;
  --card: #151A23;
  --white: #F5F3EE;
  --gray: #9CA3AF;
  --red: #E50914;
  --red-dark: #9B0D14;
  --border: #29303B;
  --page: #0A0D13;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  margin: 0;

  background:
    radial-gradient(
      circle at top,
      #111827 0,
      var(--page) 45%
    );

  color: var(--white);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}


/* =========================================================
   HEADER
========================================================= */

header {

  position: sticky;
  top: 0;

  z-index: 100;

  background:
    rgba(8,10,15,.96);

  backdrop-filter:
    blur(18px);

  border-bottom:
    1px solid var(--border);
}

.header {

  max-width: 1200px;

  margin: auto;

  padding:
    18px 20px;

  display: flex;

  justify-content:
    space-between;

  align-items: center;
}

.logo {

  display: flex;

  align-items: center;

  gap: 8px;

  font-size: 30px;

  font-weight: 800;

  letter-spacing: -1.5px;
}

.logo24 {

  background: var(--red);

  color: white;

  padding:
    2px 8px;

  border-radius: 7px;

  line-height: 1;

}

.tagline {

  margin-top: 3px;

  color: var(--gray);

  font-size: 11px;

  letter-spacing: 2px;

  text-transform: uppercase;
}


/* =========================================================
   NAVIGATION
========================================================= */

.nav {

  max-width: 1200px;

  margin: auto;

  padding:
    0 20px 12px;

  display: flex;

  gap: 8px;

  overflow-x: auto;

  scrollbar-width: none;
}

.nav::-webkit-scrollbar {
  display: none;
}

.nav button {

  border: 0;

  background:
    transparent;

  color:
    #AAB1BC;

  padding:
    8px 12px;

  border-radius:
    7px;

  white-space:
    nowrap;

  cursor: pointer;

  font-weight:
    600;

  font-size:
    13px;
}

.nav button:hover {

  color: white;

  background:
    #151A23;
}

.nav button.active {

  color: white;

  background:
    var(--red);
}


/* =========================================================
   MAIN
========================================================= */

main {

  max-width: 1200px;

  margin: auto;

  padding:
    25px 20px 70px;
}


/* =========================================================
   LOCATION BAR
========================================================= */

.location {

  display: flex;

  justify-content:
    space-between;

  align-items: center;

  gap: 15px;

  margin-bottom:
    20px;

  padding:
    16px 18px;

  border:
    1px solid var(--border);

  border-radius:
    12px;

  background:
    rgba(21,26,35,.8);
}

.location-title {

  font-size:
    13px;

  color:
    var(--gray);
}

.location-title strong {

  color:
    white;

  font-size:
    17px;
}


/* =========================================================
   LANGUAGE
========================================================= */

.language {

  display:
    flex;

  gap:
    6px;
}

.language button {

  border:
    1px solid var(--border);

  background:
    transparent;

  color:
    var(--gray);

  border-radius:
    7px;

  padding:
    7px 11px;

  cursor:
    pointer;
}

.language button.active {

  background:
    var(--red);

  border-color:
    var(--red);

  color:
    white;
}


/* =========================================================
   INTRO
========================================================= */

.intro {

  background:
    linear-gradient(
      135deg,
      #151A23,
      #0F131B
    );

  border:
    1px solid var(--border);

  border-radius:
    16px;

  padding:
    22px;

  margin-bottom:
    24px;
}

.intro strong {

  display:
    block;

  font-size:
    18px;

  margin-bottom:
    6px;
}

.intro span {

  color:
    var(--gray);

  font-size:
    14px;

  line-height:
    1.6;
}


/* =========================================================
   SECTION
========================================================= */

.section-title {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  margin:
    30px 0 15px;
}

.section-title h2 {

  margin: 0;

  font-size:
    18px;

  letter-spacing:
    -.3px;
}

.section-title h2::before {

  content: "";

  display:
    inline-block;

  width:
    4px;

  height:
    18px;

  background:
    var(--red);

  margin-right:
    9px;

  vertical-align:
    -3px;
}


/* =========================================================
   GRID
========================================================= */

.grid {

  display:
    grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(290px, 1fr)
    );

  gap:
    18px;
}


/* =========================================================
   CARD
========================================================= */

.card {

  background:
    linear-gradient(
      145deg,
      #171C25,
      #11151D
    );

  border:
    1px solid var(--border);

  border-radius:
    15px;

  padding:
    20px;

  transition:
    transform .18s ease,
    border-color .18s ease;
}

.card:hover {

  transform:
    translateY(-3px);

  border-color:
    #4A5260;
}

.category {

  color:
    #FF3943;

  font-size:
    11px;

  font-weight:
    800;

  text-transform:
    uppercase;

  letter-spacing:
    1px;
}

.card h2 {

  margin:
    9px 0 12px;

  font-size:
    21px;

  line-height:
    1.25;

  color:
    var(--white);
}

.summary {

  color:
    #B7BEC9;

  line-height:
    1.6;

  font-size:
    14px;
}

.meta {

  margin-top:
    15px;

  color:
    #7F8896;

  font-size:
    11px;
}

.meta span {

  color:
    #FF3943;
}

.source {

  margin-top:
    15px;

  padding-top:
    13px;

  border-top:
    1px solid var(--border);

  color:
    #8F98A5;

  font-size:
    12px;
}

.read {

  display:
    inline-block;

  margin-top:
    16px;

  padding:
    10px 15px;

  background:
    var(--red);

  color:
    white;

  text-decoration:
    none;

  border-radius:
    7px;

  font-weight:
    700;

  font-size:
    13px;
}

.read:hover {

  background:
    #FF1B25;
}


/* =========================================================
   EMPTY
========================================================= */

.empty {

  text-align:
    center;

  padding:
    70px 20px;

  border:
    1px solid var(--border);

  border-radius:
    16px;

  background:
    #11151D;
}

.empty h2 {

  margin:
    0 0 10px;

  font-size:
    25px;
}

.empty p {

  color:
    var(--gray);

  line-height:
    1.6;
}


/* =========================================================
   FOOTER
========================================================= */

footer {

  max-width:
    1200px;

  margin:
    auto;

  padding:
    40px 20px 70px;

  color:
    #737C89;

  font-size:
    12px;

  text-align:
    center;

  border-top:
    1px solid var(--border);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px) {

  .header {

    padding:
      16px;
  }

  .logo {

    font-size:
      26px;
  }

  main {

    padding:
      20px 14px 60px;
  }

  .location {

    align-items:
      flex-start;

    flex-direction:
      column;
  }

  .language {

    width:
      100%;
  }

  .language button {

    flex:
      1;
  }

  .grid {

    grid-template-columns:
      1fr;
  }

  .card h2 {

    font-size:
      22px;
  }

}

</style>

</head>


<body>


<header>

  <div class="header">

    <div>

      <div class="logo">

        <span>snippet</span>

        <span class="logo24">
          24
        </span>

      </div>

      <div class="tagline">
        Fast news. Real impact.
      </div>

    </div>

  </div>


  <nav class="nav">

    <button
      class="active"
      data-filter="ALL"
    >
      Top Stories
    </button>

    <button data-filter="WORLD">
      World
    </button>

    <button data-filter="INDIA">
      India
    </button>

    <button data-filter="STATES">
      States
    </button>

    <button data-filter="Tech & AI">
      Tech & AI
    </button>

    <button data-filter="Business & Economy">
      Business
    </button>

    <button data-filter="Lifestyle & Health">
      Lifestyle
    </button>

    <button data-filter="Entertainment & Living">
      Entertainment
    </button>

    <button data-filter="Earth & Environment">
      Environment
    </button>

    <button data-filter="Sports & Culture">
      Sports
    </button>

  </nav>

</header>


<main>


  <div class="location">

    <div class="location-title">

      Current feed:

      <br>

      <strong id="locationName">
        Top Stories
      </strong>

    </div>


    <div
      class="language"
      id="languageButtons"
    >

      <button
        class="active"
        data-language="en"
      >
        English
      </button>

    </div>

  </div>


  <div class="intro">

    <strong>
      Know more. Read less.
    </strong>

    <span>
      Short, original explanations of
      important stories, with the original
      publication always credited.
    </span>

  </div>


  <div
    id="news"
    class="grid"
  >
  </div>


</main>


<footer>

  <strong>
    snippet24
  </strong>

  © 2026

  <br><br>

  Fast news. Real impact.

  <br>

  Original publishers retain their rights.

</footer>


<script>

let allArticles = [];

let currentFilter = "ALL";

let currentLanguage = "en";

let currentState = "";


/* =========================================================
   LOAD
========================================================= */

async function loadNews() {

  const container =
    document.getElementById(
      "news"
    );

  try {

    const response =
      await fetch(
        "articles.json?x="
        + Date.now()
      );

    if (!response.ok) {

      throw new Error(
        "articles.json failed"
      );

    }

    allArticles =
      await response.json();

    if (!Array.isArray(
      allArticles
    )) {

      throw new Error(
        "Invalid articles.json"
      );

    }

    render();

  } catch(error) {

    console.error(error);

    container.innerHTML = `

      <div class="empty">

        <h2>
          News feed unavailable
        </h2>

        <p>
          Please try again shortly.
        </p>

      </div>

    `;

  }

}


/* =========================================================
   FILTER
========================================================= */

function getFilteredArticles() {

  if (
    currentFilter === "ALL"
  ) {

    return allArticles;

  }


  if (
    currentFilter === "WORLD"
  ) {

    return allArticles.filter(
      article =>
        String(
          article.region || ""
        ).toUpperCase()
        === "WORLD"
    );

  }


  if (
    currentFilter === "INDIA"
  ) {

    return allArticles.filter(
      article =>
        String(
          article.region || ""
        ).toUpperCase()
        === "INDIA"
        &&
        !article.state
    );

  }


  if (
    currentFilter === "STATES"
  ) {

    return allArticles.filter(
      article =>
        article.state
    );

  }


  return allArticles.filter(
    article =>
      article.category
      === currentFilter
  );

}


/* =========================================================
   LANGUAGE BUTTONS
========================================================= */

function setupLanguages() {

  const box =
    document.getElementById(
      "languageButtons"
    );

  box.innerHTML = "";

  const languages = [
    {
      code: "en",
      name: "English"
    }
  ];


  if (currentState) {

    const stateArticle =
      allArticles.find(
        article =>
          article.state
          === currentState
      );

    if (
      stateArticle &&
      stateArticle.default_language
      &&
      stateArticle.default_language
      !== "en"
    ) {

      languages.push({

        code:
          stateArticle
            .default_language,

        name:
          stateArticle
            .default_language_name

      });

    }

  }


  languages.forEach(
    language => {

      const button =
        document.createElement(
          "button"
        );

      button.textContent =
        language.name;

      button.dataset.language =
        language.code;

      if (
        language.code
        === currentLanguage
      ) {

        button.classList.add(
          "active"
        );

      }

      button.onclick = () => {

        currentLanguage =
          language.code;

        setupLanguages();

        render();

      };

      box.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  const container =
    document.getElementById(
      "news"
    );

  const locationName =
    document.getElementById(
      "locationName"
    );


  let articles =
    getFilteredArticles();


  /*
   Find state when using STATES.
  */

  if (
    currentFilter === "STATES"
    &&
    currentState
  ) {

    articles =
      articles.filter(
        article =>
          article.state
          === currentState
      );

  }


  /*
   Translation.
  */

  const displayArticles =
    articles.slice(
      0,
      50
    );


  if (
    displayArticles.length
    === 0
  ) {

    container.innerHTML = `

      <div class="empty">

        <h2>
          No stories yet
        </h2>

        <p>
          Snippet24 is collecting
          stories for this section.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  displayArticles.forEach(
    article => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "card";


      const translation =
        article.translations
        &&
        article.translations[
          currentLanguage
        ];


      const title =
        translation
        &&
        translation.title
        ?
        translation.title
        :
        article.title;


      const summary =
        translation
        &&
        translation.summary
        ?
        translation.summary
        :
        article.summary;


      card.innerHTML = `

        <div class="category">

          ${escapeHtml(
            article.category
            || "News"
          )}

        </div>


        <h2>

          ${escapeHtml(
            title
          )}

        </h2>


        <div class="summary">

          ${escapeHtml(
            summary
          )}

        </div>


        <div class="meta">

          ${escapeHtml(
            article.country
            || ""
          )}

          ${article.state
            ? " · "
            + escapeHtml(
                article.state
              )
            : ""}

          ·

          <span>
            ${escapeHtml(
              article.category
              || "News"
            )}
          </span>

        </div>


        <div class="source">

          Source:

          <strong>

            ${escapeHtml(
              article.source
              || ""
            )}

          </strong>

        </div>


        <a
          class="read"
          href="article.html?id=${
            encodeURIComponent(
              article.id
            )
          }"
        >

          Read deep dive

        </a>

      `;


      container.appendChild(
        card
      );

    }
  );


  setupLanguages();

}


/* =========================================================
   NAVIGATION
========================================================= */

document
  .querySelectorAll(
    ".nav button"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".nav button"
            )
            .forEach(
              item =>
                item.classList
                  .remove(
                    "active"
                  )
            );


          button.classList.add(
            "active"
          );


          currentFilter =
            button.dataset.filter;


          currentState = "";

          currentLanguage = "en";


          document
            .getElementById(
              "locationName"
            )
            .textContent =
              button.textContent;


          /*
           States opens state picker.
          */

          if (
            currentFilter
            === "STATES"
          ) {

            showStates();

            return;

          }


          render();

        }
      );

    }
  );


/* =========================================================
   STATE PICKER
========================================================= */

function showStates() {

  const states = [
    ...new Set(
      allArticles
        .map(
          article =>
            article.state
        )
        .filter(Boolean)
    )
  ];


  const container =
    document.getElementById(
      "news"
    );


  if (!states.length) {

    container.innerHTML = `

      <div class="empty">

        <h2>
          States coming soon
        </h2>

        <p>
          State feeds will appear
          as sources are connected.
        </p>

      </div>

    `;

    return;

  }


  container.innerHTML = "";


  states.forEach(
    state => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "card";


      const language =
        allArticles.find(
          article =>
            article.state
            === state
        );


      card.innerHTML = `

        <div class="category">
          INDIA
        </div>

        <h2>
          ${escapeHtml(state)}
        </h2>

        <div class="summary">

          News from
          ${escapeHtml(state)}
          in
          ${escapeHtml(
            language
              ?.default_language_name
              || "English"
          )}
          and English.

        </div>

        <button
          class="read"
          type="button"
        >
          Open state news
        </button>

      `;


      card
        .querySelector(
          "button"
        )
        .onclick = () => {

          currentState =
            state;

          currentFilter =
            "STATES";

          currentLanguage =
            language
              ?.default_language
              || "en";


          document
            .getElementById(
              "locationName"
            )
            .textContent =
              state;


          render();

        };


      container.appendChild(
        card
      );

    }
  );

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(value) {

  return String(
    value || ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   START
========================================================= */

loadNews();

</script>


</body>

</html>
