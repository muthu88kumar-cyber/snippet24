<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Snippet24 — Fast News. Real Impact.</title>

  <meta
    name="description"
    content="Snippet24 — Fast news. Real impact."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080b10;
      color: #f5f5f5;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    header {
      max-width: 1100px;
      margin: auto;
      padding: 30px 20px 10px;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -3px;
    }

    .logo span {
      background: #ff1616;
      padding: 2px 10px;
      border-radius: 12px;
      letter-spacing: -1px;
    }

    .tagline {
      margin-top: 8px;
      color: #888f9c;
      letter-spacing: 5px;
      font-size: 12px;
      font-weight: 700;
    }

    nav {
      max-width: 1100px;
      margin: 25px auto 0;
      padding: 0 20px;

      display: flex;
      gap: 10px;

      overflow-x: auto;
    }

    nav button {
      border: 0;
      background: transparent;
      color: #9da3ae;

      padding: 13px 20px;
      border-radius: 18px;

      font-size: 16px;
      font-weight: 700;

      white-space: nowrap;
    }

    nav button.active {
      background: #ff1515;
      color: white;
    }

    .controls {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 20px;

      display: flex;
      justify-content: flex-end;
    }

    select {
      background: #151a23;
      color: white;

      border: 1px solid #303744;
      border-radius: 12px;

      padding: 12px 16px;

      font-size: 15px;
    }

    main {
      max-width: 1100px;
      margin: auto;
      padding: 0 20px 60px;
    }

    .feed-card {
      background: #121720;
      border: 1px solid #27303d;
      border-radius: 22px;

      padding: 28px;

      margin-bottom: 25px;
    }

    .feed-label {
      color: #858c98;
      font-size: 15px;
    }

    .feed-title {
      margin-top: 4px;
      font-size: 34px;
      font-weight: 800;
    }

    .intro {
      background: #121720;
      border: 1px solid #27303d;
      border-radius: 22px;

      padding: 30px;

      margin-bottom: 25px;
    }

    .intro h2 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .intro p {
      color: #9ba2ae;
      line-height: 1.7;
      font-size: 17px;
    }

    .count {
      color: #9299a5;
      margin: 25px 0 15px;
    }

    .article {
      background: #121720;
      border: 1px solid #27303d;
      border-radius: 22px;

      padding: 28px;

      margin-bottom: 18px;
    }

    .source {
      color: #ff3b3b;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 14px;
    }

    .article h2 {
      margin: 12px 0;

      font-size: 25px;
      line-height: 1.3;
    }

    .summary {
      color: #9da4b0;
      line-height: 1.7;
      font-size: 16px;
    }

    .meta {
      display: flex;
      justify-content: space-between;

      margin-top: 20px;

      color: #707887;
      font-size: 13px;
    }

    .original {
      display: inline-block;

      margin-top: 18px;

      color: #ff3b3b;
      font-weight: 800;

      text-decoration: none;
    }

    .loading,
    .error {
      text-align: center;
      padding: 50px;
      color: #9299a5;
    }

    .error {
      color: #ff5555;
    }

    @media (max-width: 600px) {

      .logo {
        font-size: 35px;
      }

      .feed-title {
        font-size: 29px;
      }

      .article h2 {
        font-size: 21px;
      }

      .article {
        padding: 22px;
      }
    }

  </style>
</head>

<body>

<header>

  <div class="logo">
    snippet <span>24</span>
  </div>

  <div class="tagline">
    FAST NEWS. REAL IMPACT.
  </div>

</header>

<nav id="categoryNav"></nav>

<div class="controls">

  <select id="languageSelect">

    <option value="en">English</option>

    <option value="ta">தமிழ்</option>

    <option value="hi">हिन्दी</option>

    <option value="te">తెలుగు</option>

    <option value="kn">ಕನ್ನಡ</option>

    <option value="ml">മലയാളം</option>

    <option value="bn">বাংলা</option>

    <option value="mr">मराठी</option>

  </select>

</div>

<main>

  <section class="feed-card">

    <div class="feed-label">
      Current feed:
    </div>

    <div
      id="feedTitle"
      class="feed-title"
    >
      Loading...
    </div>

  </section>

  <section class="intro">

    <h2 id="introTitle">
      Know more. Read less.
    </h2>

    <p id="introText">
      Short, original explanations of important
      stories, with the original publication
      always credited.
    </p>

  </section>

  <div
    id="storyCount"
    class="count"
  ></div>

  <div id="articles">

    <div class="loading">
      Loading news...
    </div>

  </div>

</main>

<script>

const CATEGORY_ORDER = [
  "World",
  "India",
  "Business",
  "Technology & AI",
  "Sports",
  "Entertainment",
  "Lifestyle"
];

const UI_TRANSLATIONS = {

  en: {
    current: "Current feed:",
    introTitle: "Know more. Read less.",
    introText:
      "Short, original explanations of important stories, with the original publication always credited.",
    stories: "stories available",
    original: "Read original →"
  },

  ta: {
    current: "தற்போதைய செய்தி:",
    introTitle: "அதிகம் தெரிந்து கொள்ளுங்கள். குறைவாகப் படியுங்கள்.",
    introText:
      "முக்கிய செய்திகளின் சுருக்கமான விளக்கங்கள். அசல் செய்தி வெளியீட்டிற்கு எப்போதும் உரிய கிரெடிட் வழங்கப்படும்.",
    stories: "செய்திகள் உள்ளன",
    original: "அசல் செய்தியைப் படிக்க →"
  },

  hi: {
    current: "वर्तमान फ़ीड:",
    introTitle: "ज्यादा जानें। कम पढ़ें।",
    introText:
      "महत्वपूर्ण खबरों की संक्षिप्त और मूल व्याख्याएं, जिसमें मूल प्रकाशन को हमेशा श्रेय दिया जाता है।",
    stories: "खबरें उपलब्ध हैं",
    original: "मूल खबर पढ़ें →"
  },

  te: {
    current: "ప్రస్తుత ఫీడ్:",
    introTitle: "ఎక్కువ తెలుసుకోండి. తక్కువ చదవండి.",
    introText:
      "ముఖ్యమైన వార్తల సంక్షిప్త వివరణలు. అసలు ప్రచురణకు ఎల్లప్పుడూ క్రెడిట్ ఇవ్వబడుతుంది.",
    stories: "వార్తలు అందుబాటులో ఉన్నాయి",
    original: "అసలు వార్త చదవండి →"
  },

  kn: {
    current: "ಪ್ರಸ್ತುತ ಫೀಡ್:",
    introTitle: "ಹೆಚ್ಚು ತಿಳಿಯಿರಿ. ಕಡಿಮೆ ಓದಿ.",
    introText:
      "ಪ್ರಮುಖ ಸುದ್ದಿಗಳ ಸಂಕ್ಷಿಪ್ತ ವಿವರಣೆಗಳು. ಮೂಲ ಪ್ರಕಟಣೆಗೆ ಯಾವಾಗಲೂ ಕ್ರೆಡಿಟ್ ನೀಡಲಾಗುತ್ತದೆ.",
    stories: "ಸುದ್ದಿಗಳು ಲಭ್ಯವಿವೆ",
    original: "ಮೂಲ ಸುದ್ದಿ ಓದಿ →"
  },

  ml: {
    current: "നിലവിലെ ഫീഡ്:",
    introTitle: "കൂടുതൽ അറിയൂ. കുറച്ച് വായിക്കൂ.",
    introText:
      "പ്രധാന വാർത്തകളുടെ ചുരുക്കത്തിലുള്ള വിശദീകരണങ്ങൾ. യഥാർത്ഥ പ്രസിദ്ധീകരണത്തിന് എല്ലായ്പ്പോഴും ക്രെഡിറ്റ് നൽകുന്നു.",
    stories: "വാർത്തകൾ ലഭ്യമാണ്",
    original: "യഥാർത്ഥ വാർത്ത വായിക്കുക →"
  },

  bn: {
    current: "বর্তমান ফিড:",
    introTitle: "বেশি জানুন। কম পড়ুন।",
    introText:
      "গুরুত্বপূর্ণ খবরের সংক্ষিপ্ত ব্যাখ্যা, যেখানে মূল প্রকাশনাকে সবসময় কৃতিত্ব দেওয়া হয়।",
    stories: "টি খবর পাওয়া যাচ্ছে",
    original: "মূল খবর পড়ুন →"
  },

  mr: {
    current: "सध्याचा फीड:",
    introTitle: "जास्त जाणून घ्या. कमी वाचा.",
    introText:
      "महत्त्वाच्या बातम्यांचे संक्षिप्त स्पष्टीकरण, मूळ प्रकाशनाला नेहमी श्रेय दिले जाते.",
    stories: "बातम्या उपलब्ध आहेत",
    original: "मूळ बातमी वाचा →"
  }

};


let allData = null;

let currentCategory = "World";

let currentLanguage = "en";


function escapeHTML(value) {

  const div = document.createElement("div");

  div.textContent = value || "";

  return div.innerHTML;

}


function createCategoryButtons() {

  const nav =
    document.getElementById(
      "categoryNav"
    );

  nav.innerHTML = "";

  CATEGORY_ORDER.forEach(
    category => {

      const button =
        document.createElement("button");

      button.textContent = category;

      button.dataset.category =
        category;

      if (
        category === currentCategory
      ) {
        button.classList.add(
          "active"
        );
      }

      button.onclick = () => {

        currentCategory =
          category;

        createCategoryButtons();

        render();

      };

      nav.appendChild(button);

    }
  );

}


async function translateText(
  text,
  target
) {

  if (
    !text ||
    target === "en"
  ) {
    return text;
  }

  try {

    const url =
      "https://translate.googleapis.com/" +
      "translate_a/single" +
      "?client=gtx" +
      "&sl=en" +
      "&tl=" +
      encodeURIComponent(target) +
      "&dt=t" +
      "&q=" +
      encodeURIComponent(text);

    const response =
      await fetch(url);

    if (!response.ok) {
      return text;
    }

    const data =
      await response.json();

    if (
      !data ||
      !data[0]
    ) {
      return text;
    }

    return data[0]
      .map(part => part[0])
      .join("");

  } catch (error) {

    console.error(
      "Translation error:",
      error
    );

    return text;
  }

}


async function translateArticle(
  article
) {

  if (
    currentLanguage === "en"
  ) {
    return {
      ...article
    };
  }

  const title =
    await translateText(
      article.title,
      currentLanguage
    );

  const summary =
    await translateText(
      article.summary,
      currentLanguage
    );

  return {
    ...article,
    title,
    summary
  };

}


function formatDate(dateString) {

  try {

    return new Date(
      dateString
    ).toLocaleString(
      undefined,
      {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }
    );

  } catch {

    return dateString;

  }

}


async function render() {

  if (!allData) {
    return;
  }

  const articles =
    (
      allData.categories[
        currentCategory
      ] || []
    );

  const ui =
    UI_TRANSLATIONS[
      currentLanguage
    ] || UI_TRANSLATIONS.en;

  document.querySelector(
    ".feed-label"
  ).textContent =
    ui.current;

  document.getElementById(
    "feedTitle"
  ).textContent =
    currentCategory;

  document.getElementById(
    "introTitle"
  ).textContent =
    ui.introTitle;

  document.getElementById(
    "introText"
  ).textContent =
    ui.introText;

  document.getElementById(
    "storyCount"
  ).textContent =
    `${articles.length} ${ui.stories}`;

  const container =
    document.getElementById(
      "articles"
    );

  container.innerHTML = "";

  if (!articles.length) {

    container.innerHTML =
      `<div class="error">
        No stories available.
      </div>`;

    return;
  }

  const translated = [];

  for (
    const article of articles
  ) {

    translated.push(
      await translateArticle(
        article
      )
    );

  }

  translated.forEach(
    article => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "article";

      card.innerHTML = `

        <div class="source">
          ${escapeHTML(
            article.source
          )}
        </div>

        <h2>
          ${escapeHTML(
            article.title
          )}
        </h2>

        <div class="summary">
          ${escapeHTML(
            article.summary
          )}
        </div>

        <div class="meta">

          <span>
            ${escapeHTML(
              formatDate(
                article.published_at
              )
            )}
          </span>

          <span>
            ${escapeHTML(
              article.category
            )}
          </span>

        </div>

        <a
          class="original"
          href="${escapeHTML(
            article.url
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${ui.original}
        </a>

      `;

      container.appendChild(card);

    }
  );

}


async function loadNews() {

  try {

    const response =
      await fetch(
        "articles.json?t=" +
        Date.now()
      );

    if (!response.ok) {
      throw new Error(
        "Unable to load articles.json"
      );
    }

    allData =
      await response.json();

    createCategoryButtons();

    await render();

  } catch (error) {

    console.error(error);

    document.getElementById(
      "articles"
    ).innerHTML =
      `<div class="error">
        Unable to load news.
      </div>`;

  }

}


document.getElementById(
  "languageSelect"
).addEventListener(
  "change",
  async event => {

    currentLanguage =
      event.target.value;

    await render();

  }
);


loadNews();

</script>

</body>
</html>
