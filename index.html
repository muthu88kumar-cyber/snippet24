<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Snippet24 — Fast News. Real Impact.</title>
<meta name="description" content="Snippet24 — Fast News. Real Impact.">

<style>
:root{
  --navy:#071b3a;
  --navy-light:#102a52;
  --yellow:#f7c600;
  --red:#df252b;
  --green:#176b4d;
  --light:#f6f8fb;
  --white:#ffffff;
  --text:#101d32;
  --muted:#68758a;
  --border:#e4e9f0;
  --soft:#eef2f7;
  --shadow:0 8px 28px rgba(7,27,58,.08);
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
}

/* =========================================================
   HEADER
========================================================= */

.header{
  background:#fff;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1250px;
  margin:auto;
  padding:18px 24px;
  display:flex;
  align-items:center;
  gap:30px;
}

/* =========================================================
   LOGO
========================================================= */

.logo{
  min-width:270px;
  text-decoration:none;
  color:var(--navy);
  display:block;
}

.logo-main{
  display:flex;
  align-items:center;
  line-height:.9;
  font-size:52px;
  font-weight:900;
  letter-spacing:-4px;
}

/*
   The red dot belongs to the "i".
*/
.logo-snippet{
  position:relative;
  display:inline-block;
}

.logo-i{
  position:relative;
  display:inline-block;
}

/*
   Hide the normal i dot and create our own red dot.
   This makes the red dot clearly part of the i.
*/
.logo-i::before{
  content:"";
  position:absolute;
  width:10px;
  height:10px;
  background:var(--red);
  border-radius:50%;
  top:-11px;
  left:50%;
  transform:translateX(-50%);
}

.logo-24{
  margin-left:20px;
  background:var(--yellow);
  color:#fff;
  border-radius:17px;
  padding:10px 15px 9px;
  font-size:48px;
  font-weight:900;
  letter-spacing:-4px;
  line-height:.82;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:82px;
  height:64px;
}

.slogan{
  margin-top:13px;
  margin-left:6px;
  font-size:12px;
  font-weight:800;
  letter-spacing:4px;
  color:var(--navy);
  white-space:nowrap;
}

.slogan span{
  color:var(--red);
  font-size:14px;
  margin:0 4px;
}

/* =========================================================
   SEARCH
========================================================= */

.search{
  flex:1;
  height:48px;
  border:1px solid var(--border);
  border-radius:28px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#fff;
  transition:.2s;
}

.search:focus-within{
  border-color:var(--navy);
  box-shadow:0 0 0 3px rgba(7,27,58,.06);
}

.search-icon{
  font-size:13px;
  margin-right:10px;
  color:var(--navy);
}

.search input{
  border:0;
  outline:0;
  width:100%;
  font-size:15px;
  color:var(--text);
  background:transparent;
}

.search input::placeholder{
  color:#8290a4;
}

/* =========================================================
   WEATHER / TIME
========================================================= */

.header-info{
  display:flex;
  align-items:center;
  gap:20px;
  white-space:nowrap;
}

.weather{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
}

.weather-icon{
  font-size:25px;
}

.weather small{
  color:var(--muted);
  font-size:10px;
}

.time{
  font-weight:800;
  font-size:14px;
}

/* =========================================================
   NAVIGATION
========================================================= */

.nav{
  background:#fff;
  border-bottom:1px solid var(--border);
}

.nav-inner{
  max-width:1250px;
  margin:auto;
  padding:7px 20px;
  display:flex;
  gap:5px;
  overflow-x:auto;
  scrollbar-width:none;
}

.nav-inner::-webkit-scrollbar{
  display:none;
}

.nav-item{
  flex:0 0 auto;
  border:0;
  background:transparent;
  color:var(--navy);
  padding:11px 14px;
  border-radius:9px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
  transition:.2s;
  white-space:nowrap;
}

.nav-item:hover,
.nav-item.active{
  background:var(--navy);
  color:#fff;
}

.nav-item.home{
  color:var(--red);
}

.nav-item.home:hover,
.nav-item.home.active{
  background:var(--red);
  color:#fff;
}

/* =========================================================
   LIVE WIRE
========================================================= */

.livebar{
  background:var(--navy);
  color:#fff;
}

.live-inner{
  max-width:1250px;
  margin:auto;
  padding:9px 24px;
  display:flex;
  align-items:center;
  gap:12px;
  overflow:hidden;
}

.live-dot{
  flex:0 0 auto;
  width:8px;
  height:8px;
  background:var(--red);
  border-radius:50%;
  animation:pulse 1.3s infinite;
}

.live-label{
  flex:0 0 auto;
  color:var(--yellow);
  font-weight:900;
  font-size:12px;
  letter-spacing:1px;
}

.live-text{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  font-size:13px;
}

@keyframes pulse{
  50%{
    opacity:.35;
  }
}

/* =========================================================
   MAIN
========================================================= */

.container{
  max-width:1250px;
  margin:auto;
  padding:30px 24px 70px;
}

.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  margin:25px 0 17px;
  font-size:15px;
  font-weight:900;
  text-transform:uppercase;
}

.section-title:before{
  content:"";
  width:5px;
  height:20px;
  border-radius:5px;
  background:var(--red);
}

/* =========================================================
   HERO
========================================================= */

.hero{
  display:grid;
  grid-template-columns:1.45fr 1fr;
  gap:25px;
}

.hero-image{
  min-height:350px;
  border-radius:18px;
  background:linear-gradient(135deg,#e9eef5,#d9e1ec);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#7d8a9e;
  overflow:hidden;
  position:relative;
}

.hero-image img{
  width:100%;
  height:100%;
  min-height:350px;
  object-fit:cover;
  display:block;
}

.hero-content{
  padding:18px 0;
}

.category{
  display:inline-block;
  padding:6px 11px;
  background:#fff2f2;
  color:var(--red);
  border-radius:20px;
  font-size:11px;
  font-weight:900;
}

.hero h1{
  font-size:36px;
  line-height:1.08;
  margin:15px 0;
  letter-spacing:-1px;
}

.hero p{
  color:var(--muted);
  line-height:1.6;
  font-size:14px;
}

.meta{
  color:var(--muted);
  font-size:12px;
  margin-top:20px;
}

/* =========================================================
   STORY GRID
========================================================= */

.story-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.story{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}

.story:hover{
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}

.story-img{
  height:145px;
  background:#e8edf4;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8290a4;
  overflow:hidden;
  font-size:12px;
}

.story-img img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.story-body{
  padding:13px;
}

.story-category{
  color:var(--red);
  font-size:10px;
  font-weight:900;
  text-transform:uppercase;
}

.story h3{
  font-size:15px;
  line-height:1.25;
  margin:8px 0;
}

.story .meta{
  margin-top:8px;
}

/* =========================================================
   CATEGORY SECTIONS
========================================================= */

.category-block{
  margin-top:42px;
}

.category-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:2px solid var(--navy);
  padding-bottom:9px;
  margin-bottom:15px;
}

.category-head h2{
  margin:0;
  font-size:20px;
}

.category-head button{
  border:0;
  background:none;
  color:var(--red);
  font-weight:800;
  cursor:pointer;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

/* =========================================================
   GOOD READS
========================================================= */

.good-read{
  background:var(--navy);
  color:#fff;
  border-radius:18px;
  padding:28px;
  margin-top:40px;
}

.good-read .section-title{
  margin-top:0;
}

.good-read .section-title:before{
  background:var(--yellow);
}

.good-read .story{
  color:var(--text);
}

/* =========================================================
   LOADING / ERROR
========================================================= */

.loading{
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
}

.error{
  background:#fff1f1;
  color:#a71920;
  border:1px solid #ffd0d0;
  padding:18px;
  border-radius:10px;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
  background:var(--navy);
  color:#fff;
  margin-top:50px;
}

.footer-inner{
  max-width:1250px;
  margin:auto;
  padding:35px 24px;
  display:flex;
  justify-content:space-between;
  gap:25px;
}

.footer-logo{
  font-size:25px;
  font-weight:900;
}

.footer-logo span{
  color:var(--yellow);
}

.footer-text{
  color:#b9c4d4;
  font-size:13px;
  line-height:1.6;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:1000px){

  .header-inner{
    flex-wrap:wrap;
    gap:15px;
  }

  .logo{
    min-width:auto;
  }

  .search{
    order:3;
    flex-basis:100%;
  }

  .hero{
    grid-template-columns:1fr;
  }

  .story-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .category-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:700px){

  .header-inner{
    padding:14px;
  }

  .logo-main{
    font-size:40px;
    letter-spacing:-3px;
  }

  .logo-24{
    margin-left:12px;
    min-width:62px;
    height:49px;
    padding:8px 10px;
    font-size:36px;
    border-radius:13px;
  }

  .logo-i::before{
    width:8px;
    height:8px;
    top:-8px;
  }

  .slogan{
    font-size:9px;
    letter-spacing:2px;
    margin-top:10px;
  }

  .slogan span{
    font-size:10px;
    margin:0 2px;
  }

  .header-info{
    margin-left:auto;
  }

  .weather,
  .time{
    display:none;
  }

  .container{
    padding:20px 14px 50px;
  }

  .hero h1{
    font-size:28px;
  }

  .hero-image,
  .hero-image img{
    min-height:230px;
  }

  .story-grid,
  .category-grid{
    grid-template-columns:1fr;
  }

  .nav-item{
    padding:10px 12px;
    font-size:11px;
  }

  .footer-inner{
    flex-direction:column;
  }
}

/* =========================================================
   VERY SMALL PHONES
========================================================= */

@media(max-width:430px){

  .logo-main{
    font-size:34px;
  }

  .logo-24{
    min-width:54px;
    height:43px;
    font-size:31px;
    margin-left:9px;
  }

  .slogan{
    font-size:7px;
    letter-spacing:1.8px;
  }

  .search{
    height:44px;
  }

  .hero h1{
    font-size:25px;
  }
}
</style>
</head>

<script>

/* =========================================================
   SNIPPET24 NEWS ENGINE
========================================================= */

let articles = [];
let filteredArticles = [];


/* =========================================================
   CATEGORIES
========================================================= */

const categories = [

  "In India",

  "Security and Peace",

  "Law Around Us",

  "Science and Development",

  "Business and Economy",

  "Society and Culture",

  "Human and Environment",

  "Tech and AI",

  "Good Reads"

];


/* =========================================================
   LOAD ARTICLES.JSON
========================================================= */

async function loadArticles(){

  try{

    const response =
      await fetch("articles.json");

    if(!response.ok){

      throw new Error(
        "Unable to load articles.json"
      );

    }

    const data =
      await response.json();


    if(Array.isArray(data)){

      articles = data;

    }

    else if(Array.isArray(data.articles)){

      articles = data.articles;

    }

    else if(Array.isArray(data.items)){

      articles = data.items;

    }

    else{

      articles = [];

    }


    filteredArticles = articles;

    renderHome();

    updateLiveWire();

  }

  catch(error){

    console.error(error);

    document.getElementById("app").innerHTML = `

      <div class="error">

        <strong>
          News could not be loaded.
        </strong>

        <br><br>

        Please check that
        <b>articles.json</b>
        is present in the same GitHub folder
        as index.html.

      </div>

    `;

  }

}


/* =========================================================
   GET TITLE
========================================================= */

function getTitle(article){

  return article.title ||
         article.headline ||
         article.name ||
         "Untitled story";

}


/* =========================================================
   GET DESCRIPTION
========================================================= */

function getDescription(article){

  return article.description ||
         article.summary ||
         article.excerpt ||
         article.content ||
         "";

}


/* =========================================================
   GET IMAGE
========================================================= */

function getImage(article){

  return article.image ||
         article.image_url ||
         article.imageUrl ||
         article.thumbnail ||
         article.urlToImage ||
         "";

}


/* =========================================================
   GET CATEGORY
========================================================= */

function getCategory(article){

  return article.category ||
         article.section ||
         article.topic ||
         "In India";

}


/* =========================================================
   GET SOURCE
========================================================= */

function getSource(article){

  return article.source ||
         article.source_name ||
         article.publisher ||
         "Snippet24";

}


/* =========================================================
   GET TIME
========================================================= */

function getTime(article){

  return article.time ||
         article.publishedAt ||
         article.date ||
         "";

}


/* =========================================================
   NORMALISE
========================================================= */

function normalise(value){

  return String(value || "")
    .toLowerCase()
    .replace(/&/g,"and")
    .replace(/[^a-z0-9]+/g," ")
    .trim();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   IMAGE HTML
========================================================= */

function imageHTML(article,className){

  const image = getImage(article);

  if(!image){

    return `

      <div class="${className}">
        Image unavailable
      </div>

    `;

  }


  return `

    <div class="${className}">

      <img
        src="${escapeHTML(image)}"
        alt=""
        loading="lazy"
        onerror="this.parentElement.innerHTML='Image unavailable'"
      >

    </div>

  `;

}


/* =========================================================
   STORY CARD
========================================================= */

function storyCard(article){

  return `

    <article class="story">

      ${imageHTML(article,"story-img")}

      <div class="story-body">

        <div class="story-category">
          ${escapeHTML(getCategory(article))}
        </div>

        <h3>
          ${escapeHTML(getTitle(article))}
        </h3>

        <div class="meta">

          ${escapeHTML(getTime(article))}

          ${
            getTime(article)
              ? " • "
              : ""
          }

          ${escapeHTML(getSource(article))}

        </div>

      </div>

    </article>

  `;

}


/* =========================================================
   SHOW HOME
========================================================= */

function showHome(){

  document
    .querySelectorAll(".nav-item")
    .forEach(item =>
      item.classList.remove("active")
    );


  const home =
    document.querySelector(".nav-item.home");

  if(home){
    home.classList.add("active");
  }


  const search =
    document.getElementById("searchInput");

  if(search){
    search.value = "";
  }


  filteredArticles = articles;

  renderHome();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   RENDER HOME
========================================================= */

function renderHome(){

  if(!articles.length){

    document.getElementById("app").innerHTML = `

      <div class="loading">
        No stories available.
      </div>

    `;

    return;

  }


  const data =
    filteredArticles.length
      ? filteredArticles
      : articles;


  const hero =
    data[0];


  const secondary =
    data.slice(1,5);


  let html = `

    <div class="section-title">
      Latest Stories
    </div>


    <section class="hero">

      ${imageHTML(hero,"hero-image")}


      <div class="hero-content">

        <span class="category">
          ${escapeHTML(getCategory(hero))}
        </span>


        <h1>
          ${escapeHTML(getTitle(hero))}
        </h1>


        <p>
          ${escapeHTML(
            getDescription(hero)
          ).substring(0,280)}
        </p>


        <div class="meta">

          ${escapeHTML(getTime(hero))}

          ${
            getTime(hero)
              ? " • "
              : ""
          }

          ${escapeHTML(getSource(hero))}

        </div>

      </div>

    </section>


    <div style="height:18px"></div>


    <section class="story-grid">

      ${
        secondary
          .map(storyCard)
          .join("")
      }

    </section>

  `;


  /*
     Category sections
  */

  categories.forEach(category => {

    const items =
      articles
        .filter(article =>
          normalise(
            getCategory(article)
          ) ===
          normalise(category)
        )
        .slice(0,6);


    if(!items.length){
      return;
    }


    html += `

      <section class="category-block">

        <div class="category-head">

          <h2>
            ${escapeHTML(category)}
          </h2>

          <button
            onclick="filterCategory('${escapeHTML(category)}')">
            View all →
          </button>

        </div>


        <div class="category-grid">

          ${
            items
              .map(storyCard)
              .join("")
          }

        </div>

      </section>

    `;

  });


  /*
     Good Reads section
  */

  const goodReads =
    articles
      .filter(article =>
        normalise(
          getCategory(article)
        ) === normalise("Good Reads")
      )
      .slice(0,3);


  if(goodReads.length){

    html += `

      <section class="good-read">

        <div class="section-title">
          Good Reads
        </div>


        <div class="category-grid">

          ${
            goodReads
              .map(storyCard)
              .join("")
          }

        </div>

      </section>

    `;

  }


  document.getElementById("app").innerHTML =
    html;

}


/* =========================================================
   FILTER CATEGORY
========================================================= */

function filterCategory(category){

  document
    .querySelectorAll(".nav-item")
    .forEach(item =>
      item.classList.remove("active")
    );


  const buttons =
    document.querySelectorAll(".nav-item");


  buttons.forEach(button => {

    if(
      normalise(button.textContent)
        .includes(
          normalise(category)
            .split(" ")[0]
        )
    ){

      button.classList.add("active");

    }

  });


  filteredArticles =
    articles.filter(article =>
      normalise(
        getCategory(article)
      ) ===
      normalise(category)
    );


  /*
     If exact category isn't found,
     try partial matching.
  */

  if(!filteredArticles.length){

    filteredArticles =
      articles.filter(article =>
        normalise(
          getCategory(article)
        ).includes(
          normalise(category)
        )
      );

  }


  const search =
    document.getElementById("searchInput");

  if(search){
    search.value="";
  }


  renderFilteredCategory(category);


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================================================
   RENDER CATEGORY
========================================================= */

function renderFilteredCategory(category){

  const data =
    filteredArticles;


  if(!data.length){

    document.getElementById("app").innerHTML = `

      <div class="section-title">
        ${escapeHTML(category)}
      </div>

      <div class="loading">
        No stories available in this category yet.
      </div>

    `;

    return;

  }


  let html = `

    <div class="section-title">
      ${escapeHTML(category)}
    </div>


    <section class="story-grid">

      ${
        data
          .map(storyCard)
          .join("")
      }

    </section>

  `;


  document.getElementById("app").innerHTML =
    html;

}


/* =========================================================
   SEARCH
========================================================= */

function searchStories(query){

  const value =
    normalise(query);


  if(!value){

    filteredArticles = articles;

    renderHome();

    return;

  }


  filteredArticles =
    articles.filter(article => {

      const title =
        normalise(getTitle(article));

      const description =
        normalise(
          getDescription(article)
        );

      const category =
        normalise(
          getCategory(article)
        );

      const source =
        normalise(
          getSource(article)
        );


      return (

        title.includes(value) ||

        description.includes(value) ||

        category.includes(value) ||

        source.includes(value)

      );

    });


  if(!filteredArticles.length){

    document.getElementById("app").innerHTML = `

      <div class="section-title">
        Search Results
      </div>

      <div class="loading">

        No stories found for
        <strong>
          "${escapeHTML(query)}"
        </strong>.

      </div>

    `;

    return;

  }


  document.getElementById("app").innerHTML = `

    <div class="section-title">
      Search Results
    </div>


    <section class="story-grid">

      ${
        filteredArticles
          .map(storyCard)
          .join("")
      }

    </section>

  `;

}


/* =========================================================
   LIVE WIRE
========================================================= */

function updateLiveWire(){

  const liveText =
    document.getElementById("liveText");


  if(
    !liveText ||
    !articles.length
  ){

    return;

  }


  const headlines =
    articles
      .slice(0,10)
      .map(article =>
        getTitle(article)
      )
      .filter(Boolean);


  if(!headlines.length){
    return;
  }


  let index = 0;


  function rotateHeadline(){

    liveText.textContent =
      headlines[index];


    index =
      (index + 1) %
      headlines.length;

  }


  rotateHeadline();


  setInterval(
    rotateHeadline,
    5000
  );

}


/* =========================================================
   CLOCK
========================================================= */

function updateClock(){

  const clock =
    document.getElementById("clock");


  if(!clock){
    return;
  }


  const now =
    new Date();


  clock.textContent =
    now.toLocaleTimeString(
      "en-IN",
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );

}


setInterval(
  updateClock,
  1000
);


updateClock();


/* =========================================================
   START
========================================================= */

loadArticles();

</script>
