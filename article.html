<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Snippet24 — Story</title>

<style>

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f5f7fa;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 20px;
}

header a {
  color: white;
  text-decoration: none;
  font-weight: 800;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 30px 18px;
}

article {
  background: white;
  padding: 28px;

  border-radius: 16px;
}

h1 {
  line-height: 1.2;
}

.summary {
  font-size: 18px;
  line-height: 1.7;
  color: #4b5563;
}

.deep {
  margin-top: 30px;
}

.line {
  padding: 12px 0;
  border-bottom: 1px solid #e5e7eb;
  line-height: 1.6;
}

.source {
  margin-top: 30px;
  padding: 18px;

  background: #f3f4f6;
  border-radius: 10px;
}

.source a {
  word-break: break-all;
}

</style>

</head>

<body>

<header>

<a href="index.html">
  Snippet24
</a>

</header>


<main>

<article id="article">

Loading...

</article>

</main>


<script>

async function loadArticle() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const id =
    params.get("id");

  const box =
    document.getElementById("article");

  if (!id) {

    box.innerHTML =
      "<h1>Article not found</h1>";

    return;
  }

  try {

    const response =
      await fetch(
        "articles.json?x=" + Date.now()
      );

    const articles =
      await response.json();

    const article =
      articles.find(
        item => item.id === id
      );

    if (!article) {

      box.innerHTML =
        "<h1>Article not found</h1>";

      return;
    }

    const lines =
      (article.deep_dive || [])
        .map(
          (line, index) => `
            <div class="line">
              <strong>${index + 1}.</strong>
              ${escapeHtml(line)}
            </div>
          `
        )
        .join("");

    box.innerHTML = `

      <h1>
        ${escapeHtml(article.title)}
      </h1>

      <p class="summary">
        ${escapeHtml(article.summary)}
      </p>

      <div class="deep">

        <h2>
          Deep Dive
        </h2>

        ${lines}

      </div>

      <div class="source">

        <strong>
          Source:
        </strong>

        ${escapeHtml(article.source)}

        <br><br>

        <strong>
          Original URL:
        </strong>

        <br>

        <a
          href="${safeUrl(article.source_url)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          ${escapeHtml(article.source_url)}
        </a>

      </div>

    `;

  } catch (error) {

    box.innerHTML =
      "<h1>Unable to load article.</h1>";

    console.error(error);

  }

}


function escapeHtml(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function safeUrl(value) {

  try {

    const url =
      new URL(value);

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {
      return url.href;
    }

  } catch {}

  return "#";

}


loadArticle();

</script>

</body>

</html>
