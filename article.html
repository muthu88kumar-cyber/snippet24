<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Snippet24 — Article</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: #f3f6fa;

  color: #111827;
}

header {
  background: #111827;

  color: white;

  padding: 30px 20px;
}

.header-inner {
  max-width: 900px;

  margin: auto;
}

.logo {
  font-size: 30px;

  font-weight: 850;
}

.tagline {
  color: #cbd5e1;

  margin-top: 5px;
}

main {
  max-width: 900px;

  margin: auto;

  padding: 30px 16px 60px;
}

.article {
  background: white;

  border-radius: 20px;

  padding: 30px;

  box-shadow:
    0 5px 25px rgba(15, 23, 42, .07);
}

.category {
  color: #2563eb;

  font-size: 12px;

  font-weight: 800;

  text-transform: uppercase;
}

h1 {
  font-size: 34px;

  line-height: 1.2;

  margin: 10px 0 20px;
}

.summary {
  font-size: 18px;

  line-height: 1.7;

  color: #4b5563;
}

.badge {
  display: inline-block;

  margin-top: 20px;

  padding: 7px 10px;

  border-radius: 999px;

  background: #dcfce7;

  color: #166534;

  font-size: 12px;

  font-weight: 700;
}

.source {
  margin-top: 28px;

  padding-top: 20px;

  border-top: 1px solid #e5e7eb;

  color: #6b7280;

  line-height: 1.7;
}

.source a {
  color: #2563eb;

  text-decoration: none;
}

.back {
  display: inline-block;

  margin-top: 25px;

  padding: 11px 15px;

  background: #111827;

  color: white;

  text-decoration: none;

  border-radius: 9px;

  font-weight: 700;
}

.error {
  background: #fee2e2;

  color: #991b1b;

  padding: 20px;

  border-radius: 14px;
}

</style>

</head>

<body>

<header>

  <div class="header-inner">

    <div class="logo">
      Snippet24
    </div>

    <div class="tagline">
      News, explained.
    </div>

  </div>

</header>


<main>

  <article
    id="article"
    class="article"
  >

    Loading...

  </article>

</main>


<script>

async function loadArticle() {

  const container =
    document.getElementById(
      "article"
    );

  try {

    const params =
      new URLSearchParams(
        window.location.search
      );

    const id =
      params.get("id");

    if (!id) {

      throw new Error(
        "Article ID is missing."
      );

    }

    const response =
      await fetch(
        "articles.json?cache=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "Could not load articles.json."
      );

    }

    const articles =
      await response.json();

    const article =
      articles.find(
        item =>
          String(item.id) ===
          String(id)
      );

    if (!article) {

      throw new Error(
        "Article not found."
      );

    }

    document.title =
      article.title +
      " — Snippet24";

    container.innerHTML = `

      <div class="category">
        ${escapeHtml(
          article.category || "News"
        )}
      </div>

      <h1>
        ${escapeHtml(
          article.title
        )}
      </h1>

      <div class="summary">
        ${escapeHtml(
          article.summary || ""
        )}
      </div>

      <div class="badge">
        ${
          article.summary_method === "ai"
            ? "AI-assisted original summary"
            : "Original automated summary"
        }
      </div>

      <div class="source">

        <strong>
          Source:
        </strong>

        ${escapeHtml(
          article.source ||
          "Unknown source"
        )}

        <br><br>

        Original publication:

        <br>

        <a
          href="${safeUrl(
            article.source_url
          )}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open original publication
        </a>

      </div>

      <a
        class="back"
        href="index.html"
      >
        ← Back to news
      </a>

    `;

  } catch (error) {

    console.error(error);

    container.innerHTML = `

      <div class="error">

        <strong>
          Unable to open this article.
        </strong>

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


function escapeHtml(value) {

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function safeUrl(value) {

  try {

    const url =
      new URL(value);

    if (
      url.protocol === "https:" ||
      url.protocol === "http:"
    ) {

      return url.href;

    }

  } catch {}

  return "#";

}


loadArticle();

</script>

</body>

</html>
