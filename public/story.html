<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Snippet24 — Story</title>

  <meta
    name="description"
    content="Snippet24 — AI-curated multilingual news."
  >

  <link
    rel="stylesheet"
    href="/styles.css"
  >

  <style>

    .story-page {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px 100px;
    }

    .back-button {
      display: inline-block;
      margin-bottom: 25px;
      padding: 10px 16px;
      border-radius: 999px;
      background: #eee;
      color: #111;
      text-decoration: none;
      font-weight: 600;
    }

    .story-category {
      display: inline-block;
      margin-bottom: 15px;
      padding: 7px 13px;
      border-radius: 999px;
      background: #eee;
      font-size: 14px;
      font-weight: 600;
    }

    .story-title {
      font-size: clamp(34px, 6vw, 64px);
      line-height: 1.05;
      margin: 10px 0 20px;
    }

    .story-meta {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    .story-image {
      width: 100%;
      display: block;
      border-radius: 20px;
      margin: 25px 0 30px;
      background: #eee;
    }

    .image-note {
      font-size: 12px;
      color: #777;
      margin-top: -20px;
      margin-bottom: 30px;
    }

    .story-summary {
      font-size: 21px;
      line-height: 1.65;
      margin-bottom: 30px;
    }

    .key-points {
      background: #f5f5f5;
      border-radius: 18px;
      padding: 25px;
      margin: 30px 0;
    }

    .key-points h2 {
      margin-top: 0;
    }

    .key-points li {
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .source-box {
      border-top: 1px solid #ddd;
      margin-top: 40px;
      padding-top: 25px;
      color: #666;
    }

    .source-box a {
      color: #3158a6;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      padding: 80px 20px;
      font-size: 20px;
    }

    .error {
      padding: 30px;
      background: #f7eaea;
      border-radius: 15px;
      color: #8a2222;
    }

    .language-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 25px;
    }

    .language-bar button {
      border: 0;
      padding: 9px 14px;
      border-radius: 999px;
      background: #eee;
      cursor: pointer;
      font-size: 14px;
    }

    .language-bar button.active {
      background: #111;
      color: white;
    }

    @media (max-width: 600px) {

      .story-page {
        padding: 20px 16px 90px;
      }

      .story-summary {
        font-size: 18px;
      }

      .story-image {
        border-radius: 14px;
      }

    }

  </style>

</head>


<body>


<header class="site-header">

  <div class="topbar">

    <a
      class="brand"
      href="/"
    >
      <span>snippet</span><b>24</b>
    </a>

    <div class="tagline">
      FAST NEWS
      <i>•</i>
      REAL IMPACT
    </div>

  </div>

</header>


<main class="story-page">


  <a
    href="/"
    class="back-button"
  >
    ← Back to Snippet24
  </a>


  <div
    id="story"
    class="loading"
  >
    Loading story…
  </div>


</main>


<script>

const LANGUAGES = {

  en: "English",
  ta: "தமிழ்",
  te: "తెలుగు",
  kn: "ಕನ್ನಡ",
  ml: "മലയാളം",
  hi: "हिन्दी"

};


let currentStory = null;

let currentLanguage = "en";


function escapeHTML(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function getStoryId() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


function formatDate(value) {

  if (!value) return "";

  const date =
    new Date(value);

  if (
    Number.isNaN(
      date.getTime()
    )
  ) {

    return "";

  }

  return date.toLocaleString(
    undefined,
    {
      dateStyle: "medium",
      timeStyle: "short"
    }
  );

}


function renderStory() {

  const container =
    document.getElementById(
      "story"
    );


  if (!currentStory) {

    container.innerHTML = `
      <div class="error">
        Story not found.
      </div>
    `;

    return;

  }


  const translation =
    currentStory.translations?.[
      currentLanguage
    ] ||
    currentStory.translations?.en ||
    {

      headline:
        currentStory.snippet24?.headline ||
        "",

      summary:
        currentStory.snippet24?.summary ||
        "",

      keyPoints:
        currentStory.snippet24?.keyPoints ||
        []

    };


  const headline =
    translation.headline ||
    currentStory.snippet24?.headline ||
    "Snippet24 Story";


  const summary =
    translation.summary ||
    currentStory.snippet24?.summary ||
    "";


  const keyPoints =
    Array.isArray(
      translation.keyPoints
    )
      ? translation.keyPoints
      : [];


  const image =
    currentStory.imageUrl;


  const category =
    currentStory.snippet24?.category ||
    "News";


  const location =
    currentStory.snippet24?.location ||
    "";


  const sourceName =
    currentStory.source?.sourceName ||
    "Original source";


  const sourceUrl =
    currentStory.source?.sourceUrl ||
    "#";


  const published =
    currentStory.source?.publishedAt ||
    currentStory.createdAt ||
    "";


  let keyPointsHTML = "";


  if (keyPoints.length) {

    keyPointsHTML = `

      <section class="key-points">

        <h2>
          Key Points
        </h2>

        <ul>

          ${keyPoints
            .map(
              point =>
                `<li>${escapeHTML(point)}</li>`
            )
            .join("")}

        </ul>

      </section>

    `;

  }


  const imageHTML = image

    ? `

      <img
        class="story-image"
        src="${escapeHTML(image)}"
        alt="AI-generated editorial illustration"
      >

      <div class="image-note">
        AI-generated editorial illustration.
        Not an original event photograph.
      </div>

    `

    : "";


  container.innerHTML = `

    <div class="language-bar">

      ${Object.entries(
        LANGUAGES
      )
        .map(
          ([code, name]) => `

            <button
              data-language="${code}"
              class="${
                code === currentLanguage
                  ? "active"
                  : ""
              }"
            >
              ${name}
            </button>

          `
        )
        .join("")}

    </div>


    <article>

      <div class="story-category">
        ${escapeHTML(category)}
      </div>


      <h1 class="story-title">
        ${escapeHTML(headline)}
      </h1>


      <div class="story-meta">

        ${escapeHTML(sourceName)}

        ${location
          ? ` • ${escapeHTML(location)}`
          : ""}

        ${published
          ? ` • ${escapeHTML(
              formatDate(published)
            )}`
          : ""}

      </div>


      ${imageHTML}


      <div class="story-summary">
        ${escapeHTML(summary)}
      </div>


      ${keyPointsHTML}


      <div class="source-box">

        <strong>
          Source
        </strong>

        <p>
          This Snippet24 story is an
          original AI-assisted editorial
          presentation based on the
          attributed source.
        </p>

        <a
          href="${escapeHTML(sourceUrl)}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Read the authoritative source →
        </a>

      </div>


    </article>

  `;


  document
    .querySelectorAll(
      "[data-language]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          currentLanguage =
            button.dataset.language;

          renderStory();

        }
      );

    });

}


async function loadStory() {

  const id =
    getStoryId();


  const container =
    document.getElementById(
      "story"
    );


  if (!id) {

    container.innerHTML = `

      <div class="error">

        No story was selected.

        <br><br>

        Please return to the
        Snippet24 homepage.

      </div>

    `;

    return;

  }


  try {

    const response =
      await fetch(
        `/api/story/${encodeURIComponent(id)}`
      );


    if (!response.ok) {

      throw new Error(
        "Story could not be loaded."
      );

    }


    currentStory =
      await response.json();


    renderStory();


  } catch (error) {

    console.error(
      error
    );


    container.innerHTML = `

      <div class="error">

        <strong>
          Unable to load this story.
        </strong>

        <br><br>

        Please try again.

      </div>

    `;

  }

}


document.addEventListener(
  "DOMContentLoaded",
  loadStory
);

</script>


</body>

</html>
