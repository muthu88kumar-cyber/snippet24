name: Update Snippet24 News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: snippet24-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify files
        run: |
          echo "Checking project files..."
          test -f curator.py
          test -f articles.json
          echo "curator.py found"
          echo "articles.json found"

      - name: Run news curator
        run: |
          python curator.py

      - name: Validate articles.json
        run: |
          python - <<'PY'
          import json
          import sys

          with open("articles.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          categories = [
              "World",
              "India",
              "States",
              "Tech & AI",
              "Business",
              "Lifestyle"
          ]

          total = 0
          failed = False

          print("")
          print("========== SNIPPET24 NEWS CHECK ==========")

          for category in categories:
              articles = data.get("categories", {}).get(category, [])

              count = len(articles)
              total += count

              print(f"{category}: {count}")

              if count == 0:
                  print(f"ERROR: {category} has 0 articles")
                  failed = True

              if count > 100:
                  print(f"ERROR: {category} has more than 100 articles")
                  failed = True

          print("------------------------------------------")
          print(f"TOTAL ARTICLES: {total}")
          print("------------------------------------------")

          if total == 0:
              print("ERROR: articles.json contains no articles.")
              sys.exit(1)

          if failed:
              print("Validation failed.")
              sys.exit(1)

          print("JSON VALIDATION PASSED")
          PY

      - name: Show first articles
        run: |
          python - <<'PY'
          import json

          with open("articles.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for category, articles in data["categories"].items():
              print("")
              print("###", category)

              for article in articles[:3]:
                  print("-", article.get("title", ""))
                  print(" ", article.get("source", ""))
                  print(" ", article.get("url", ""))

          PY

      - name: Commit updated articles
        run: |
          git config user.name "Snippet24 News Bot"
          git config user.email "actions@github.com"

          git add articles.json

          if git diff --cached --quiet; then
            echo "No changes to articles.json"
          else
            git commit -m "Update Snippet24 news articles"
            git push
          fi