name: Auto-Curate News Feed

on:
  schedule:
    - cron: '*/30 * * * *'  # Runs automatically every 30 minutes
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write           # Grants permission to push changes to articles.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Curator Script
        run: python curator.py

      - name: Commit and Push New Articles
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add articles.json
          git commit -m "Auto-update news feed via curator.py" || exit 0
          git push
