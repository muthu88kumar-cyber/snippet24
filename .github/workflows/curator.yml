name: Snippet24 News Curator

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  curate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run news curator
        run: |
          python curator.py

      - name: Show article counts
        run: |
          python - <<'PY'
          import json

          with open("articles.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          total = 0

          for category, articles in data["categories"].items():
              count = len(articles)
              total += count
              print(f"{category}: {count}")

          print(f"TOTAL: {total}")
          PY

      - name: Commit updated news
        run: |
          git config user.name "Snippet24 Bot"
          git config user.email "actions@github.com"

          git add articles.json

          if git diff --cached --quiet; then
            echo "No article changes."
          else
            git commit -m "Update news feed"
            git push
          fi