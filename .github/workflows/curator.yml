name: Update Snippet24 News

on:
  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run news curator
        run: |
          python curator.py

      - name: Check generated JSON
        run: |
          python - <<'PY'
          import json

          with open("articles.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          articles = data.get("articles", [])

          print("Total articles:", len(articles))

          categories = data.get("categories", {})

          for name, count in categories.items():
              print(f"{name}: {count}")

          if not articles:
              raise SystemExit(
                  "ERROR: articles.json contains no articles"
              )
          PY

      - name: Commit updated news
        run: |
          git config user.name "Snippet24 Bot"
          git config user.email "actions@users.noreply.github.com"

          git add articles.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update news feed"
            git push
          fi