name: Auto-Curate News Feed

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  curate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news curator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python curator.py

      - name: Show articles result
        run: |
          echo "===== articles.json ====="
          cat articles.json

      - name: Commit generated articles
        run: |

          git config user.name "Snippet24 Bot"

          git config user.email "actions@users.noreply.github.com"

          git add articles.json

          if git diff --cached --quiet; then
            echo "No article changes to commit."
          else
            git commit -m "Update curated news"
            git push
          fi