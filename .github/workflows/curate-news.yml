name: Update Snippet24 News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI news curator
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          POLLINATIONS_TEXT_MODEL: openai
          POLLINATIONS_IMAGE_MODEL: zimage
        run: |
          python curator.py

      - name: Validate articles.json
        run: |
          python - <<'PY'
          import json
          import sys

          with open("articles.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          required = [
              "World",
              "India",
              "Business",
              "Technology",
              "Lifestyle"
          ]

          total = 0

          for category in required:

              articles = data.get(
                  "categories",
                  {}
              ).get(
                  category,
                  []
              )

              count = len(articles)

              print(
                  f"{category}: {count}"
              )

              total += count

              for article in articles[:5]:

                  required_fields = [
                      "headline",
                      "summary",
                      "publisher",
                      "url",
                      "published_at"
                  ]

                  missing = [
                      field
                      for field in required_fields
                      if not article.get(field)
                  ]

                  if missing:
                      print(
                          "ERROR: missing fields:",
                          missing
                      )

                      sys.exit(1)

          print()
          print(
              f"TOTAL: {total}"
          )

          if total == 0:
              print(
                  "ERROR: World has only 0 articles"
              )

              sys.exit(1)

          print(
              "articles.json validation passed."
          )
          PY

      - name: Configure Git
        run: |
          git config user.name "Snippet24 Bot"
          git config user.email "snippet24-bot@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add articles.json

          if git diff --cached --quiet; then
            echo "No article changes."
          else
            git commit -m "Update Snippet24 news"
          fi

      - name: Push changes
        run: |
          git push