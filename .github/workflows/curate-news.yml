name: Snippet24 News Curator

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  curate:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run news curator
        run: |
          python curator.py

      - name: Check generated articles
        run: |
          test -f articles.json
          python - <<'PY'
          import json

          with open("articles.json", encoding="utf-8") as f:
              data = json.load(f)

          print("Updated:", data.get("updated_at"))

          for category, articles in data["categories"].items():
              print(category, len(articles))

          PY

      - name: Commit updated news
        run: |
          git config user.name "Snippet24 Bot"
          git config user.email "actions@users.noreply.github.com"

          git add articles.json

          git diff --cached --quiet || \
            git commit -m "Update news feed"

          git push