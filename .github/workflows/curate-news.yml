name: Update Snippet24 News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI news curator
        run: |
          python curator.py

      - name: Validate articles.json
        run: |
          python validate_articles.py

      - name: Configure Git
        run: |
          git config user.name "Snippet24 News Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add articles.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update news feed"
          fi

      - name: Push changes
        run: |
          git push