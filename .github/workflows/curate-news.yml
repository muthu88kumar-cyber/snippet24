name: Snippet24 News Update

on:

  workflow_dispatch:

  schedule:

    # Every 30 minutes
    - cron: "*/30 * * * *"


permissions:

  contents: write


jobs:

  curate:

    runs-on: ubuntu-latest


    steps:

      # ----------------------------------------------------
      # CHECKOUT
      # ----------------------------------------------------

      - name: Checkout repository

        uses: actions/checkout@v4


      # ----------------------------------------------------
      # PYTHON
      # ----------------------------------------------------

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      # ----------------------------------------------------
      # DEPENDENCIES
      # ----------------------------------------------------

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ----------------------------------------------------
      # RUN CURATOR
      # ----------------------------------------------------

      - name: Run Snippet24 curator

        run: |

          python curator.py


      # ----------------------------------------------------
      # SAVE ARTICLES
      # ----------------------------------------------------

      - name: Commit updated articles

        run: |

          git config user.name "Snippet24 Bot"

          git config user.email \
            "actions@users.noreply.github.com"

          git add articles.json

          git diff --cached --quiet || \
            git commit \
            -m "Update curated news"

          git push