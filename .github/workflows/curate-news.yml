name: Update Snippet24 News

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: snippet24-news-update
  cancel-in-progress: true

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run news curator
        run: |
          python curator.py

      - name: Validate articles.json
        run: |
          python - <<'PY'
          import json

          with open("articles.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          categories = data.get("categories", {})

          print("Categories:")

          total = 0

          for name, articles in categories.items():
              count = len(articles)
              total += count
              print(f"{name}: {count}")

          print(f"TOTAL: {total}")

          required = [
              "World",
              "India",
              "States",
              "Tech & AI",
              "Business",
              "Lifestyle"
          ]

          for category in required:
              count = len(categories.get(category, []))

              if count < 50:
                  raise SystemExit(
                      f"ERROR: {category} has only {count} articles"
                  )

          if len(categories.get("Top Stories", [])) == 0:
              raise SystemExit(
                  "ERROR: Top Stories is empty"
              )

          print("articles.json validation passed.")
          PY

      - name: Configure Git
        run: |
          git config user.name "Snippet24 News Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add articles.json

          if git diff --cached --quiet; then
            echo "No article changes."
          else
            git commit -m "Update Snippet24 news articles"
          fi

      - name: Sync with remote
        run: |
          git fetch origin main
          git rebase origin/main

      - name: Push changes
        run: |
          git push origin HEAD:main